# Ruff configuration for the EarningsNerd backend.
# CI runs `ruff check .` as a blocking gate (see .github/workflows/ci.yml).

target-version = "py311"
line-length = 120

[lint]
# Rule set is pinned EXPLICITLY (pyflakes `F` + the pycodestyle `E4`/`E7`/`E9` subset) rather than
# inherited from ruff's defaults: ruff 0.16 widened its default selection (UP/I/B/BLE/...) and the
# same clean tree reported 2,767 findings overnight with no code change. Widen deliberately, in a
# PR that also autofixes, never by tool upgrade. The tool version itself is pinned in
# requirements-dev.txt (installed by CI and by the local gate).
select = ["E4", "E7", "E9", "F"]
# Line-length (E501) is intentionally not enforced — formatting is out of scope here.
ignore = ["E501"]

[lint.per-file-ignores]
# Package __init__ files legitimately re-export names without using them locally.
"__init__.py" = ["F401"]
# main.py imports app modules *after* load_dotenv() + Sentry.init(), which must run
# first — the ordering is deliberate, so module-import-not-at-top does not apply.
"main.py" = ["E402"]
