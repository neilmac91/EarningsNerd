<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <style>
    html,body{margin:0;background:#E8E6DF;font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;color:#1A1A17}
    iframe{display:block;border:0;background:#F4F3EE}
  </style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:56px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.012em">EarningsNerd landing redesign · breakpoints</h1>
    <p style="margin:0;font-size:14px;color:#374151">One fluid page rendered at 380, 768, 1280 and 1440, light and dark. Open <a href="Landing (redesign).dc.html" style="color:#3C6650;text-decoration:underline;text-underline-offset:3px">the live page</a> to interact; the Tweaks panel switches headline, access line and theme.</p>
  </div>

  <section aria-label="Light theme" style="display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280">Light</h2>
    <div style="display:flex;align-items:flex-start;gap:40px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">380 × mobile</figcaption><iframe title="Landing at 380px, light" src="Landing (redesign).dc.html?theme=light" width="380" height="7200" style="border-radius:16px;box-shadow:0 4px 6px -1px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.10)"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">768 × tablet</figcaption><iframe title="Landing at 768px, light" src="Landing (redesign).dc.html?theme=light" width="768" height="6200" style="border-radius:16px;box-shadow:0 4px 6px -1px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.10)"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">1280 × desktop</figcaption><iframe title="Landing at 1280px, light" src="Landing (redesign).dc.html?theme=light" width="1280" height="5000" style="border-radius:16px;box-shadow:0 4px 6px -1px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.10)"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">1440 × desktop</figcaption><iframe title="Landing at 1440px, light" src="Landing (redesign).dc.html?theme=light" width="1440" height="5000" style="border-radius:16px;box-shadow:0 4px 6px -1px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.10)"></iframe></figure>
    </div>
  </section>

  <section aria-label="Dark theme" style="display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280">Dark</h2>
    <div style="display:flex;align-items:flex-start;gap:40px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">380 × mobile</figcaption><iframe title="Landing at 380px, dark" src="Landing (redesign).dc.html?theme=dark" width="380" height="7200" style="border-radius:16px;background:#0B1120"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">768 × tablet</figcaption><iframe title="Landing at 768px, dark" src="Landing (redesign).dc.html?theme=dark" width="768" height="6200" style="border-radius:16px;background:#0B1120"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">1280 × desktop</figcaption><iframe title="Landing at 1280px, dark" src="Landing (redesign).dc.html?theme=dark" width="1280" height="5000" style="border-radius:16px;background:#0B1120"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">1440 × desktop</figcaption><iframe title="Landing at 1440px, dark" src="Landing (redesign).dc.html?theme=dark" width="1440" height="5000" style="border-radius:16px;background:#0B1120"></iframe></figure>
    </div>
  </section>

  <section aria-label="Current page, for comparison" style="display:flex;flex-direction:column;gap:16px">
    <h2 style="margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280">Current page (recreated from frontend/app/page.tsx), for comparison</h2>
    <div style="display:flex;align-items:flex-start;gap:40px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">1280 × light</figcaption><iframe title="Current landing at 1280px, light" src="Landing (current).dc.html?theme=light" width="1280" height="4600" style="border-radius:16px"></iframe></figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px"><figcaption style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#374151">380 × dark</figcaption><iframe title="Current landing at 380px, dark" src="Landing (current).dc.html?theme=dark" width="380" height="5200" style="border-radius:16px;background:#0B1120"></iframe></figure>
    </div>
  </section>
</div>
