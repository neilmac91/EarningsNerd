<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="148mm" height="210mm" viewBox="0 0 148 210">
  <title>EarningsNerd notebook cover, A5</title>
  <desc>A5 notebook cover (148 x 210 mm). Cream ground, the italic "Nerd" large in sage, the margin as a printed rule 18 mm from the left edge, and the stacked lockup small at the foot.</desc>
  <!-- The ground and the rule run 3 mm past every edge, so a printer can add bleed by widening
       the canvas without redrawing. "Nerd" is Inter 700 italic at 44 mm (124.724 pt), -0.02em,
       in the wordmark's sage. The margin (docs/brand/06-system.md §6): a sage hairline rule and
       nothing else. Bracket marks are twins of markers in text, and a cover carries no text to
       twin, so printed marks here would be decoration, which the Marked Copy Rule forbids; the
       owner's own marks go beside the rule. The stacked lockup is
       copied from frontend/public/assets/earningsnerd-logo-stacked-light.svg (paths verbatim from
       earningsnerd-mark-mono.svg; wordmark Inter 700, -0.02em), 30 mm wide, mark 9.46 mm,
       clear space 1.097 mm. -->
  <g id="artwork" inkscape:groupmode="layer" inkscape:label="artwork">
    <rect x="-3" y="-3" width="154" height="216" fill="#F4F3EE"/>
    <line x1="18" y1="-3" x2="18" y2="213" stroke="#CFE0D6" stroke-width="0.3"/>
    <text x="28" y="88" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" font-style="italic" letter-spacing="-0.88" fill="#3C6650">Nerd</text>
    <g id="lockup-stacked" transform="translate(68,178) scale(0.1)">
      <g transform="translate(102.7,0)">
        <g transform="translate(0,-14.8)">
          <path d="M2.8 28L26.2 28Q29 28 29 30.8L29 36.2Q29 39 26.2 39L12.9 39Q11.5 39 11.5 40.4L11.5 42.1Q11.5 43.5 12.9 43.5L23.2 43.5Q26 43.5 26 46.3L26 51.7Q26 54.5 23.2 54.5L12.9 54.5Q11.5 54.5 11.5 55.9L11.5 57.6Q11.5 59 12.9 59L26.2 59Q29 59 29 61.8L29 67.2Q29 70 26.2 70L2.8 70Q0 70 0 67.2L0 30.8Q0 28 2.8 28Z" fill="#3C6650"></path>
          <g transform="translate(0.92,6.98) scale(0.9193)"><path d="M36.98 84.42L49.76 58.87Q50.65 57.08 51.54 58.87L65.21 86.2Q66.11 88 68.13 88L68.57 88Q70.59 88 71.49 86.2L93.87 41.43Q95.66 37.86 92.09 36.07L84.21 32.13Q80.64 30.34 78.85 33.92L69.24 53.13Q68.35 54.92 67.46 53.13L53.79 25.8Q52.89 24 50.87 24L50.43 24Q48.41 24 47.51 25.8L18.2 84.42Q16.41 88 20.41 88L31.19 88Q35.19 88 36.98 84.42Z" fill="#3C6650"></path><path d="M101.76 42.95L101.05 12.49Q100.96 8.49 97.7 10.81L72.91 28.53Q69.65 30.85 73.23 32.64L98.27 45.16Q101.85 46.95 101.76 42.95Z" fill="#3C6650"></path></g>
        </g>
      </g>
      <text x="150" y="136" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.88" fill="#1A1A17">Earnings<tspan font-style="italic" fill="#3C6650">Nerd</tspan></text>
    </g>
  </g>
</svg>
