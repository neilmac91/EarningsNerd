<!doctype html>
<!--
  Email header and footer line, 600px wide: table layout with inline styles, as mail clients need.

  Where the real thing renders today: backend/app/services/email_service.py, _wrap_html, which
  wraps every email body in a cream page and a 600px panel and currently shows a text-only
  wordmark. This block is what its first row would become (lockup, hairline, marked tagline) and
  the line its footer row would carry. Port the markup into _wrap_html; do not link this file.

  Client notes. The header's mark is the app tile (earningsnerd-appicon.svg, the cream mark on a
  sage squircle), not the bare mark (D-035). Gmail's and Outlook's apps darken a light-only message,
  recolouring its text but leaving its images alone, so the bare sage mark on transparent would fall
  from 5.9:1 on this cream to about 2.5:1 on their dark grey; the tile brings its own ground, and
  its mark keeps 4.4:1 on either. Gmail and Outlook also drop inline SVG, so this preview's svg sits
  in a cell wrapped for Outlook to skip; the port puts the hosted raster in its place and drops that
  [if !mso] conditional, since Outlook shows a PNG:
    <img src="{base}/assets/earningsnerd-appicon.png" width="32" height="32" alt=""
      style="display:block;border:0;">
  The raster is 128 px square, written from the SVG by frontend/scripts/generate-brand-assets.mjs.
  Its alt is empty because the text wordmark beside it names the brand, and carries it alone where
  images are blocked. Build base from settings.FRONTEND_URL, as the mail's links are built, with any
  trailing slash stripped (base = settings.FRONTEND_URL.rstrip("/"), as
  backend/app/services/waitlist_service.py does): a doubled slash answers 308. Sent mail keeps the
  whole address, so the origin is published along with the path: use the origin that answers without
  a redirect (https://www.earningsnerd.io today; the apex answers 307 to it) and keep it answering.
  FRONTEND_URL defaults to the apex (backend/app/config.py) and production sets none, so the port
  makes https://www.earningsnerd.io the default in the same PR. The path never moves
  (frontend/public/assets/LOGO_README.md; frontend/tests/unit/publishedAssetUrls.spec.ts). It is a
  raster under /assets/, not the PWA's /icons/icon-192.png: the waitlist gate does not pass /icons,
  and the manifest is free to change its icons.
  The @font-face rule points at the repository's Inter for this preview only (the email uses no
  data face); a sent email falls back through the inline font stacks. The highlight under "shows its work" is two nested spans:
  the outer span's own font box is the lower 38% of the tagline's line box (tint, with the 2px
  hairline as its bottom border), lowered onto it; the inner span restores the ink. At 18px:
    tint 5.187px = (0.45978 × 18 - 2) / 1.20996, lowered 1.091px = 0.24121 × 18 - 2 - 0.24121 × 5.187
  Outlook gets the plain phrase through the conditional comment.
-->
