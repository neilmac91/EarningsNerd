<!doctype html>
<!--
  Email header and footer line, 600px wide: table layout with inline styles, as mail clients need.

  Where the real thing renders today: backend/app/services/email_service.py, _wrap_html, which
  wraps every email body in a cream page and a 600px panel and currently shows a text-only
  wordmark. This block is what its first row would become (lockup, hairline, marked tagline) and
  the line its footer row would carry. Port the markup into _wrap_html; do not link this file.

  Client notes. Gmail and Outlook drop inline SVG: the mark is wrapped so Outlook skips it, and
  where it is dropped the text wordmark carries the brand alone. The port carries the hosted raster
  as an <img> in place of this <svg>: /assets/earningsnerd-mark-sage.png (256 px wide, transparent,
  the same bytes as the Excel export's mark; frontend/scripts/generate-brand-assets.mjs writes
  both). Build its address from settings.FRONTEND_URL, as the mail's links are built. Sent mail
  keeps the whole address, so the origin is published along with the path: use the origin that
  answers without a redirect (https://www.earningsnerd.io today; the apex answers 307 to it) and
  keep it answering. FRONTEND_URL defaults to the apex (backend/app/config.py), so production's
  value is confirmed before the port deploys (tasks/todo.md F22). The path never moves
  (frontend/public/assets/LOGO_README.md; frontend/tests/unit/publishedAssetUrls.spec.ts).
  Dark mode: Gmail's and Outlook's apps darken a light-only message but leave its images alone, so
  the sage mark on transparent falls from 5.9:1 on this cream to about 2.5:1 on their dark grey,
  while the text wordmark beside it is recoloured and stays legible. The self-backgrounded app tile
  (earningsnerd-appicon.svg, a cream mark on a sage squircle) holds on both. Carrying it means a
  raster of the tile under /assets/, written by the brand pipeline beside the mark's and added to
  the spec's register, not the PWA's /icons/icon-192.png: the waitlist gate does not pass /icons,
  and the manifest is free to change its icons. Which one the header carries is the founder's
  call (F22).
  The @font-face rule points at the repository's Inter for this preview only (the email uses no
  data face); a sent email falls back through the inline font stacks. The highlight under "shows its work" is two nested spans:
  the outer span's own font box is the lower 38% of the tagline's line box (tint, with the 2px
  hairline as its bottom border), lowered onto it; the inner span restores the ink. At 18px:
    tint 5.187px = (0.45978 × 18 - 2) / 1.20996, lowered 1.091px = 0.24121 × 18 - 2 - 0.24121 × 5.187
  Outlook gets the plain phrase through the conditional comment.
-->
