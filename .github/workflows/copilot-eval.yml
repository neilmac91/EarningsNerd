name: Copilot filing fidelity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Only files that can change what the paid Copilot fidelity run measures: the directories the
      # transitive import closure of evals.copilot_bootstrap and evals.copilot_runner lives in, plus
      # the data they load at runtime (prompts, the golden set and sources, the model env file) and
      # this workflow. Gate: backend/tests/unit/test_copilot_eval_paths.py recomputes the closure from
      # the run steps below and fails when a reachable module or runtime input falls outside this
      # list, or when backend/tests/**, evals Markdown, scripts or migrations would trigger the run;
      # it also reads every run step below as an allowlist, so an untraced program fails it.
      # `backend/app/*` is every file directly under app/ (not its subdirectories).
      - 'backend/app/*'
      - 'backend/app/models/**'
      - 'backend/app/schemas/**'
      - 'backend/app/services/**'
      - 'backend/app/utils/**'
      - 'backend/app/data/**'
      - 'backend/app/assets/**'
      - 'backend/prompts/**'
      - 'backend/evals/__init__.py'
      - 'backend/evals/copilot_*'
      - 'backend/evals/schema.py'
      - 'backend/evals/scorers.py'
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - '.github/ai-model.env'
      - '.github/workflows/copilot-eval.yml'

permissions:
  contents: read

concurrency:
  group: copilot-fidelity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-eval:
    # Ready for review is the explicit spend opt-in after offline gates and independent reviews.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SKIP_REDIS_INIT: 'true'
      SECRET_KEY: copilot-eval-secret-key-for-ci-0123456789
      STRIPE_SECRET_KEY: sk_test_ci_copilot_eval
      STRIPE_WEBHOOK_SECRET: whsec_ci_copilot_eval
      PWNED_PASSWORD_CHECK_ENABLED: 'false'
      USE_STATEMENT_FINANCIALS: 'true'
      # OPENAI_BASE_URL / AI_DEFAULT_MODEL come from .github/ai-model.env (loaded in the first step).
      AI_FALLBACK_MODEL: ''
      AI_FALLBACK_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - name: Load AI model configuration
        run: grep -v '^#' .github/ai-model.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact runtime and development requirements
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Prepare actual SEC sources in a new scratch database
        working-directory: backend
        shell: bash
        run: |
          mkdir -p evals/reports/copilot
          python -m evals.copilot_bootstrap --database "$RUNNER_TEMP/copilot-fidelity.db" --output evals/reports/copilot 2>&1 | tee evals/reports/copilot/preparation.log
      - name: Run every verified question three times
        working-directory: backend
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m evals.copilot_runner --preparation evals/reports/copilot/preparation.json --output evals/reports/copilot --runs 3 2>&1 | tee evals/reports/copilot/runner.log
      - name: Show the readable report on the run page
        # Every row's verdict, including a named publication withhold, without downloading the artifact.
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if [ -f evals/reports/copilot/copilot-eval.md ]; then cat evals/reports/copilot/copilot-eval.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain source, output and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-fidelity-${{ github.run_id }}
          path: backend/evals/reports/copilot/
          if-no-files-found: warn
