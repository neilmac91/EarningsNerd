name: Copilot filing fidelity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Only files that can change what the paid Copilot fidelity run measures. The set is the
      # transitive import closure of evals.copilot_runner and evals.copilot_bootstrap plus the data
      # they load at runtime (prompts, the golden set and sources, the model env file). Gate:
      # backend/tests/unit/test_copilot_eval_paths.py recomputes the closure and fails when a reachable
      # module falls outside this list, or when backend/tests/** or evals Markdown would trigger it.
      - 'backend/app/__init__.py'
      - 'backend/app/config.py'
      - 'backend/app/database.py'
      - 'backend/app/models/**'
      - 'backend/app/schemas/**'
      - 'backend/app/utils/**'
      - 'backend/app/services/ai/**'
      - 'backend/app/services/edgar/**'
      - 'backend/app/services/__init__.py'
      - 'backend/app/services/ai_metrics.py'
      - 'backend/app/services/citation_markers.py'
      - 'backend/app/services/content_cache.py'
      - 'backend/app/services/copilot_service.py'
      - 'backend/app/services/copilot_tools.py'
      - 'backend/app/services/entitlements.py'
      - 'backend/app/services/event_loop.py'
      - 'backend/app/services/excerpt_provenance.py'
      - 'backend/app/services/facts_service.py'
      - 'backend/app/services/fallback_summary.py'
      - 'backend/app/services/filing_amendment_service.py'
      - 'backend/app/services/financial_basis.py'
      - 'backend/app/services/llm_pricing.py'
      - 'backend/app/services/metric_delta_service.py'
      - 'backend/app/services/openai_service.py'
      - 'backend/app/services/posthog_client.py'
      - 'backend/app/services/prompt_loader.py'
      - 'backend/app/services/provenance_service.py'
      - 'backend/app/services/redis_service.py'
      - 'backend/app/services/sec_rate_limiter.py'
      - 'backend/app/services/subscription_service.py'
      - 'backend/app/services/summary_generation_service.py'
      - 'backend/app/services/summary_pipeline.py'
      - 'backend/app/services/summary_request_evidence.py'
      - 'backend/app/services/summary_schema.py'
      - 'backend/app/services/summary_sections.py'
      - 'backend/app/services/summary_versioning.py'
      - 'backend/prompts/**'
      - 'backend/evals/**'
      - '!backend/evals/**.md'
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - '.github/ai-model.env'
      - '.github/workflows/copilot-eval.yml'

permissions:
  contents: read

concurrency:
  group: copilot-fidelity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-eval:
    # Ready for review is the explicit spend opt-in after offline gates and independent reviews.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SKIP_REDIS_INIT: 'true'
      SECRET_KEY: copilot-eval-secret-key-for-ci-0123456789
      STRIPE_SECRET_KEY: sk_test_ci_copilot_eval
      STRIPE_WEBHOOK_SECRET: whsec_ci_copilot_eval
      PWNED_PASSWORD_CHECK_ENABLED: 'false'
      USE_STATEMENT_FINANCIALS: 'true'
      # OPENAI_BASE_URL / AI_DEFAULT_MODEL come from .github/ai-model.env (loaded in the first step).
      AI_FALLBACK_MODEL: ''
      AI_FALLBACK_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - name: Load AI model configuration
        run: grep -v '^#' .github/ai-model.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact runtime and development requirements
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Prepare actual SEC sources in a new scratch database
        working-directory: backend
        shell: bash
        run: |
          mkdir -p evals/reports/copilot
          python -m evals.copilot_bootstrap --database "$RUNNER_TEMP/copilot-fidelity.db" --output evals/reports/copilot 2>&1 | tee evals/reports/copilot/preparation.log
      - name: Run every verified question three times
        working-directory: backend
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m evals.copilot_runner --preparation evals/reports/copilot/preparation.json --output evals/reports/copilot --runs 3 2>&1 | tee evals/reports/copilot/runner.log
      - name: Show the readable report on the run page
        # Every row's verdict, including a named publication withhold, without downloading the artifact.
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if [ -f evals/reports/copilot/copilot-eval.md ]; then cat evals/reports/copilot/copilot-eval.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain source, output and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-fidelity-${{ github.run_id }}
          path: backend/evals/reports/copilot/
          if-no-files-found: warn
