name: Copilot filing fidelity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '.github/workflows/copilot-eval.yml'

permissions:
  contents: read

concurrency:
  group: copilot-fidelity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-eval:
    # Ready for review is the explicit spend opt-in after offline gates and independent reviews.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SKIP_REDIS_INIT: 'true'
      SECRET_KEY: copilot-eval-secret-key-for-ci-0123456789
      STRIPE_SECRET_KEY: sk_test_ci_copilot_eval
      STRIPE_WEBHOOK_SECRET: whsec_ci_copilot_eval
      PWNED_PASSWORD_CHECK_ENABLED: 'false'
      USE_STATEMENT_FINANCIALS: 'true'
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      AI_DEFAULT_MODEL: deepseek-v4-pro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact runtime and development requirements
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Prepare actual SEC sources in a new scratch database
        working-directory: backend
        shell: bash
        run: |
          mkdir -p evals/reports/copilot
          python -m evals.copilot_bootstrap --database "$RUNNER_TEMP/copilot-fidelity.db" --output evals/reports/copilot 2>&1 | tee evals/reports/copilot/preparation.log
      - name: Run every verified question three times
        working-directory: backend
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m evals.copilot_runner --preparation evals/reports/copilot/preparation.json --output evals/reports/copilot --runs 3 2>&1 | tee evals/reports/copilot/runner.log
      - name: Retain source, output and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-fidelity-${{ github.run_id }}
          path: backend/evals/reports/copilot/
          if-no-files-found: warn
