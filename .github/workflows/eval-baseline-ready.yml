# The ready mark starts eval-baseline's paid draw here, and nothing else (F55).
#
# Drafts draw nothing, so marking a pull request ready must start the measurement on the head it
# already has. Until 2026-11 the ready mark did that by starting a whole CI run, which repeated
# every other job on a commit that had not changed: 127 such runs on 1-10 November 2026, about a
# fifth of CI's billed minutes (docs/ops/actions-cost-plan-2026-11.md). CI no longer runs on a
# ready mark; this workflow runs the one job that needs it.
#
# The job below is a copy of `eval-baseline` in .github/workflows/ci.yml, which still runs it on
# each push and on a manual dispatch. backend/tests/unit/test_ci_cost_controls.py fails unless the
# two are equal, so change both together. The job's own concurrency group is shared by name with
# CI's copy, so the newest draw on a pull request still replaces an older one that is running.
name: Eval baseline (ready mark)

on:
  pull_request:
    types: [ready_for_review]

jobs:
  eval-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A measurement takes 11 to 20 minutes (1-10 November 2026); see backend-tests.
    timeout-minutes: 45
    continue-on-error: true
    # The scope step reads the pull request's live draft flag; no step needs a write scope.
    permissions:
      contents: read
      pull-requests: read
    # Each run is a real DeepSeek measurement (see step below). Without this, every new
    # push to an open PR queues another full run on top of the still-running one from the last
    # push — only the latest push's result matters, so cancel superseded runs to stop paying for
    # (and waiting on) throwaway evals. Grouped per-PR so unrelated PRs don't cancel each other.
    concurrency:
      group: eval-baseline-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect AI-relevant changes
        id: scope
        # Classify this checked PR merge, not upstream changes since a stale event base. Only a pull
        # request that is ready now draws. An event's payload can still say draft after the ready
        # mark, and a re-run keeps its payload (#1315, backend/scripts/review_gate.py), so an
        # AI-relevant head reads the live draft flag; anything but an exact "false" fails closed.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::Cannot determine evaluation scope for this event."
            exit 1
          fi
          CHECKED_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          if [ "$CHECKED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Checked source does not match the workflow commit."
            exit 1
          fi
          read -r -a PARENTS <<< "$(git show -s --format=%P HEAD)"
          if [ "${#PARENTS[@]}" -ne 2 ] || [ "${PARENTS[1]}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Expected the checked PR merge and its exact head parent."
            exit 1
          fi
          for PARENT in "${PARENTS[@]}"; do
            git cat-file -e "$PARENT^{commit}"
          done
          BASE_PARENT=${PARENTS[0]}
          CHANGED_PATHS="$RUNNER_TEMP/eval-changed-paths"
          git diff --no-renames --name-only -z "$BASE_PARENT" HEAD > "$CHANGED_PATHS"
          RUN=false
          while IFS= read -r -d '' CHANGED_PATH; do
            case "$CHANGED_PATH" in
              backend/app/*|backend/evals/*|backend/prompts/*) RUN=true ;;
            esac
          done < "$CHANGED_PATHS"
          if [ "$RUN" = "false" ]; then
            echo "No AI-relevant backend changes — skipping eval-baseline."
          else
            DRAFT=unreadable
            if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft) || DRAFT=unreadable
            fi
            case "$DRAFT" in
              false) ;;
              true)
                RUN=false
                echo "::notice::Draft pull request: eval-baseline draws nothing. This head changes AI-relevant paths, so marking it ready for review starts the paid run; reserve first (lessons/ops-reserve-eval-baseline-before-each-push.md)."
                ;;
              *) echo "::error::Cannot read whether this pull request is a draft."; exit 1 ;;
            esac
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Check for eval API key
        id: key
        if: steps.scope.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEEPSEEK_API_KEY GitHub Actions secret not set — eval-baseline skipped. Add it under Settings → Secrets and variables → Actions to arm the gate."
          fi
      - name: Set up Python
        if: steps.key.outputs.have == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.key.outputs.have == 'true'
        run: pip install -r backend/requirements.txt
      - name: Load AI model configuration
        if: steps.key.outputs.have == 'true'
        run: grep -v '^#' .github/ai-model.env >> "$GITHUB_ENV"
      - name: Run baseline eval (deterministic scorers, no judge)
        if: steps.key.outputs.have == 'true'
        working-directory: backend
        # Run the FULL verified set on PRs too: recall is non-saturated now that the golden set carries
        # cash-flow/liquidity facts, so a subset's mean recall isn't apples-to-apples with the full
        # pinned baseline and would flake the gate. Manual dispatch can still pass an explicit limit.
        env:
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: eval-baseline-secret-key-for-ci-0123456789
          STRIPE_SECRET_KEY: sk_test_ci_eval
          STRIPE_WEBHOOK_SECRET: whsec_ci_eval
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # OPENAI_BASE_URL / AI_DEFAULT_MODEL come from .github/ai-model.env (loaded above).
          AI_FALLBACK_MODEL: ''
          AI_FALLBACK_BASE_URL: ''
          AI_EVIDENCE_SNAP: 'true'
          AI_FIGURE_TRACE_GATE: 'false'
          AI_FORWARD_QUOTE_GATE: 'false'
          AI_ATTRIBUTION_GATE: 'false'
          AI_ATTRIBUTION_VERIFY: 'false'
          USE_STRUCTURED_OUTPUT: 'false'
          USE_STATEMENT_FINANCIALS: 'true'
          STREAM_SECTION_REVEAL: 'true'
          EVAL_RUNS: ${{ github.event.inputs.eval_runs || '2' }}
          EVAL_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIMIT="$EVAL_LIMIT"
          else
            LIMIT=""
          fi
          # Bound spend and avoid interpolating dispatch text into executable shell.
          case "$EVAL_RUNS" in 2|3) ;; *) echo "eval_runs must be 2 or 3"; exit 1 ;; esac
          if [ -n "$LIMIT" ] && ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "limit must be blank or a positive integer"; exit 1
          fi
          ARGS=(--candidates baseline --runs "$EVAL_RUNS")
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          EVAL_CONCURRENCY=2
          ARGS+=(--concurrency "$EVAL_CONCURRENCY")
          # Scheduling evidence stays outside the unchanged report harness/baseline identity.
          mkdir -p evals/reports
          {
            printf 'source_sha=%s\nfiling_concurrency=%s\n' "$GITHUB_SHA" "$EVAL_CONCURRENCY"
            printf 'invocation=python -m evals.runner'
            printf ' %q' "${ARGS[@]}"
            printf '\n'
          } > evals/reports/ci-execution.txt
          echo "Running: python -m evals.runner ${ARGS[*]}"
          python -m evals.runner "${ARGS[@]}"
      - name: Regression gate vs pinned baseline
        if: steps.key.outputs.have == 'true'
        working-directory: backend
        run: python -m evals.regression_gate --latest
      - name: Upload eval report
        if: always() && steps.key.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            backend/evals/reports/eval_*.json
            backend/evals/reports/eval_*.md
            backend/evals/reports/ci-execution.txt
          retention-days: 14
