name: Refresh index membership

# Regenerates backend/app/data/index_membership.json (the S&P 500 ∪ Nasdaq 100 universe the earnings
# calendar filters to) from the current index constituents and opens/updates a PR whenever successful
# regeneration changes membership or metadata. The script re-stamps the file's `generated_on` date each time, so the monthly PR is the
# heartbeat that proves the refresh still works (and keeps the 100-day age gate in
# tests/unit/test_index_membership_service.py honest); its diff shows any constituent changes
# alongside the date bump. This keeps the committed-list design — auditable, human-merged,
# un-corruptable by a bad runtime fetch — while removing the manual toil.
#
# Source: both public Wikipedia constituent lists; no FMP credential is read or required.
# Nasdaq-100 constituents live on List_of_NASDAQ-100_companies, not the general Nasdaq-100 article.
# A failed fetch/parse or incomplete index aborts without replacing the committed universe and
# opens/updates the failure issue. The validated candidate is retained before PR publication so
# source success remains reviewable even if GitHub policy prevents the automatic PR.
#
# GITHUB_TOKEN-created PRs do not trigger other workflows. Required validation/review still
# precedes merge; do not bypass repository policy with a PAT or change Actions settings here.

on:
  schedule:
    - cron: '0 8 1 * *'      # 08:00 UTC on the 1st of every month
  workflow_dispatch:

concurrency:
  group: refresh-index-membership
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install regeneration dependencies
        run: pip install httpx pandas lxml beautifulsoup4

      - name: Regenerate the membership list
        working-directory: backend
        run: python scripts/refresh_index_membership.py --source auto

      - name: Validate the regenerated list
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, timezone
          d = json.loads(open("app/data/index_membership.json", encoding="utf-8").read())
          members = d["members"]
          tickers = [m["ticker"] for m in members]
          assert d["count"] == len(tickers) >= 500, f"too few tickers: {len(tickers)}"
          assert len(tickers) == len(set(tickers)), "duplicate tickers"
          assert all(t == t.strip().upper().replace("-", ".") and t for t in tickers), "un-normalized ticker"
          for req in ("AAPL", "MSFT", "NVDA", "BRK.B", "BF.B", "GOOGL", "GOOG"):
              assert req in set(tickers), f"missing mega-cap {req}"
          assert all(m.get("indices") for m in members), "entry missing an index label"
          labels = {i for m in members for i in m["indices"]}
          assert labels == {"sp500", "nasdaq100"}, f"partial universe written: {labels}"
          assert date.fromisoformat(d["generated_on"]) == datetime.now(timezone.utc).date(), "generated_on not today"
          print(f"validated {len(tickers)} members generated {d['generated_on']} via {d['source']}")
          PY

      - name: Retain the validated membership candidate
        uses: actions/upload-artifact@v7
        with:
          name: index-membership-${{ github.run_id }}
          path: backend/app/data/index_membership.json
          if-no-files-found: error

      # A new UTC date advances the heartbeat. Repeating the same public snapshot on the same
      # day is a successful no-change run and does not need another PR.
      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/data/index_membership.json; then
            echo "Membership and metadata are unchanged — nothing to publish."
            exit 0
          fi
          BRANCH="automation/refresh-index-membership"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add backend/app/data/index_membership.json
          git commit -m "Refresh index membership (S&P 500 / Nasdaq 100)"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the existing open PR for $BRANCH."
          else
            gh pr create --draft --base main --head "$BRANCH" \
              --title "Refresh index membership (S&P 500 / Nasdaq 100)" \
              --body "Automated monthly regeneration of \`backend/app/data/index_membership.json\` from the current S&P 500 + Nasdaq 100 constituents (public Wikipedia lists recorded in \`source_urls\`; no FMP key required). A successful run with changed membership or metadata opens or updates this PR: the \`generated_on\` date bump is the monthly heartbeat that proves the refresh works and keeps the 100-day age gate in \`tests/unit/test_index_membership_service.py\` green — merge it even when no tickers changed. Review any added/removed tickers in the diff. Integrity-checked in-workflow (count >= 500, unique, normalized, mega-caps present, both index labels present, generated today). Generated by \`.github/workflows/refresh-index-membership.yml\`."
          fi

      # Failure visibility: a monthly cron that fails silently lets the committed universe age past the
      # 100-day test gate (tests/unit/test_index_membership_service.py) before anyone notices. One issue
      # per outage — re-runs comment on the open issue instead of opening a new one.
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          TITLE="Universe refresh failed $TODAY"
          CAUSE="Inspect the failed step in the run log. Public-source retrieval, parsing, per-index floors (S&P 500 >= 480, Nasdaq-100 >= 90), validation, artifact upload or GitHub PR publication may have failed. No FMP credential is used.

          Fix the observed cause and re-run via *Run workflow*. If retrieval and validation passed but publication failed, the validated candidate artifact may still be available. Actions settings and credentials remain founder-owned."
          BODY="The monthly index-membership refresh failed on $TODAY: $RUN_URL

          $CAUSE

          Details: \`docs/DEPLOYMENT.md\` → *Quarterly: refresh the membership list*. The committed list (\`backend/app/data/index_membership.json\`, field \`generated_on\`) fails \`tests/unit/test_index_membership_service.py\` once it is more than 100 days old."
          EXISTING="$(gh issue list --state open --search '"Universe refresh failed" in:title' --json number,title \
            --jq '[.[] | select(.title | startswith("Universe refresh failed"))] | .[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            gh issue edit "$EXISTING" --title "$TITLE"
            echo "Updated existing failure issue #$EXISTING."
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
