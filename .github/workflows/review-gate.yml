# Rule-12 gate for lessons/ops-a-review-you-triggered-is-a-review-you-wait-for.md: a pull request
# merges only after the Codex review of its CURRENT head has completed, or with an override recorded
# in the pull request body (`Review override: <reason>`). The `review-gate` job is the status check a
# ruleset on `main` should require (founder decision: Settings → Rules → Rulesets, require status
# checks review-gate + the CI jobs, no bypass actors). A required status check needs no approver, so
# it cannot lock a solo-administrator repository. Logic and tests: backend/scripts/review_gate.py,
# backend/tests/unit/test_review_gate.py. A push does not re-trigger Codex here: after fix commits,
# comment `@codex review` immediately, and re-run this job if the review lands after the timeout.
# The workflow runs on pull_request_target, so its definition and the gate script come from the base
# branch, and a reviewed short SHA must resolve repository-wide to the head and match no other commit
# of the pull request, so neither a PR-side edit of the gate nor a crafted prefix collision can pass.
name: Review gate

on:
  # pull_request_target: the workflow DEFINITION and the checked-out code both come from the base
  # branch, so a pull request can edit neither its gate nor this file to let itself through. Safe
  # here because the job never checks out or executes pull-request code and holds only read tokens.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # `@codex review` on an unchanged head re-triggers Codex but fires no pull-request event, so the
  # comment itself re-runs the newest gate run on the pull request's head (a new attempt on that head).
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # PR updates cancel stale-head waits. Comment runs have unique groups so a bot's
  # ignored boilerplate cannot cancel a human's rerun request before it reaches the API.
  group: review-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-gate:
    # Every pull-request event runs this job, drafts included. A job skipped by its `if` reports
    # success, which a required check counts as passing, and an event's payload can still say draft
    # after the pull request was marked ready: on #1315 one update fired `ready_for_review` and an
    # `edited` event with a draft payload, which ran second, cancelled the ready run before it could
    # wait, and skipped. The script reads the live draft flag and fails while the pull request is a
    # draft. Nothing else in this job may skip or soften the gate step (a step `if`,
    # `continue-on-error`, `needs`, another step); backend/tests/unit/test_review_gate.py pins its shape.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Trusted code only: the gate script comes from the BASE branch, never from the pull request's
      # own tree (pull_request_target already checks out the base by default; the ref is explicit so
      # the test can pin it). On the bootstrap PR that first adds the script this step fails; the
      # check is not required until the ruleset exists.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Wait for the Codex review of this head, or an explicit recorded override
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_GATE_REPO: ${{ github.repository }}
          REVIEW_GATE_PR: ${{ github.event.pull_request.number }}
          REVIEW_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_GATE_TIMEOUT_MINUTES: '20'
        run: python backend/scripts/review_gate.py

  rerun-on-review-request:
    # Only a human's explicit request starts another wait. Codex's own summary includes
    # this command as boilerplate; re-running on that summary wastes another runner.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '@codex review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # The run is looked up by the pull request's current head SHA, so a run of any age is found; the
      # newest 50 runs repo-wide, which this used to search, missed most open pull requests. A skipped
      # run is never re-run: only a run from before #1331 can skip (its job carried a draft condition),
      # and a re-run keeps the definition and payload it started with, so it would skip again and, in
      # the concurrency group, cancel a run that was waiting (#1319, #1318).
      - name: Re-run the newest review-gate run on this pull request's head so it waits for the re-requested review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          run=$(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?event=pull_request_target&head_sha=$head&per_page=100" \
            --jq '[.workflow_runs[] | select(any(.pull_requests[]?; .number == '"$PR"'))] | max_by(.run_number) // empty | "\(.id) \(.status) \(.conclusion // "none")"')
          if [ -z "$run" ]; then
            echo "review-gate: no gate run on #$PR's head ${head:0:12} yet; push or edit the pull request to start one"
            exit 0
          fi
          read -r run_id status conclusion <<< "$run"
          if [ "$status" != "completed" ]; then
            echo "review-gate: run $run_id is still $status; it will observe the re-requested review itself"
            exit 0
          fi
          if [ "$conclusion" = "skipped" ]; then
            echo "review-gate: run $run_id skipped under the gate's old draft condition, and a re-run would skip again; push or edit #$PR to start a new run"
            exit 0
          fi
          gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun" >/dev/null
          echo "review-gate: re-ran run $run_id for #$PR at head ${head:0:12}"
