# P1-9: weekly data-quality report. Fires the RESEND-carrying Cloud Run job
# (earningsnerd-filing-digest) to run scripts/data_quality_report.py, which scans the remediation's
# detections (ticker integrity, per-concept coverage gaps, filing-count anomalies, partial-summary
# reasons) and emails the founder. No new GCP infra — reuses an existing job image + its RESEND env.
#
# Strong-judge measurement (WS-6 / W3-7) is two-phase. This workflow GENERATES the fixed eight-filing ×
# three-repeat cohort with the CI-only generator credential and retains every attempt's judge inputs in
# its artifact; the verdicts and the readout are produced locally by `python -m evals.judge_readout`
# through the founder's Claude subscription (`claude -p`; there is no OAuth session in CI, and no API
# credit is spent). A manual dispatch carrying `readout_b64` delivers such a judged readout through the
# same report job and generates nothing.
name: Data-quality weekly report

on:
  schedule:
    - cron: '0 13 * * 1'   # 13:00 UTC every Monday
  workflow_dispatch:
    inputs:
      readout_b64:
        description: 'Deliver an already-judged readout (readout.b64 from evals.judge_readout); no generation'
        required: false
        default: ''

concurrency:
  group: data-quality-weekly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # mint the OIDC token Workload Identity Federation exchanges

env:
  REGION: us-west1
  REPORT_JOB: earningsnerd-filing-digest   # the only job carrying DATABASE_URL + RESEND_API_KEY

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      readout: ${{ steps.handoff.outputs.readout }}
    steps:
      - uses: actions/checkout@v7
      - name: Load AI model configuration
        run: grep -v '^#' .github/ai-model.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check the generator credential before any generation
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          READOUT_B64_INPUT: ${{ inputs.readout_b64 }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -z "$READOUT_B64_INPUT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the exact runtime
        id: dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pip install -r backend/requirements.txt
      - name: Generate fixed eight filings with three attempts each and retain their judge inputs
        if: steps.dependencies.outcome == 'success' || (steps.credentials.outputs.ready == 'false' && !inputs.readout_b64)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # OPENAI_BASE_URL / AI_DEFAULT_MODEL come from .github/ai-model.env (loaded after checkout).
          AI_FALLBACK_MODEL: ''
          AI_FALLBACK_BASE_URL: ''
          USE_STRUCTURED_OUTPUT: 'false'
          USE_STATEMENT_FINANCIALS: 'true'
          STREAM_SECTION_REVEAL: 'true'
          AI_EVIDENCE_SNAP: 'true'
          AI_FIGURE_TRACE_GATE: 'false'
          AI_FORWARD_QUOTE_GATE: 'false'
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: weekly-eval-ci-only-nonproduction-0123456789
          STRIPE_SECRET_KEY: sk_test_ci_eval
          STRIPE_WEBHOOK_SECRET: whsec_ci_eval
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
        run: python -m evals.weekly_readout --generate-only
      - name: Preserve a bounded handoff even after setup or measurement failure
        id: handoff
        if: always()
        working-directory: backend
        env:
          READOUT_B64_INPUT: ${{ inputs.readout_b64 }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from app.services.ai_readout import decode_readout, encode_readout, unavailable_readout
          directory = Path('evals/reports/weekly')
          directory.mkdir(parents=True, exist_ok=True)
          path = directory / 'readout.b64'
          supplied = os.environ.get('READOUT_B64_INPUT', '').strip()
          if supplied:
              # Delivery dispatch: the locally judged readout, through the same bounded validator.
              readout = decode_readout(supplied)
          else:
              readout = decode_readout(path.read_text()) if path.exists() else unavailable_readout('Weekly measurement setup failed; no completed readout')
          encoded = encode_readout(readout)
          path.write_text(encoded)
          (directory / 'readout.json').write_text(json.dumps(readout, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('readout=' + encoded + '\n')
          if supplied and readout['reason'] == 'Weekly judged readout handoff invalid':
              # The email still says invalid; the run must say so too, not go green.
              raise SystemExit('supplied readout_b64 failed validation; nothing delivered')
          PYCODE
      - name: Retain full generation evidence, or the delivered readout, and explicit unavailable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-judged-readout-${{ github.run_id }}
          path: backend/evals/reports/weekly/
          retention-days: 30
          if-no-files-found: warn

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run the data-quality report on the RESEND-carrying job
        env:
          READOUT_B64: ${{ needs.measure.outputs.readout }}
        run: |
          set -euo pipefail
          # The job's container entrypoint is `python`; --args appends the script path.
          ARGS="scripts/data_quality_report.py"
          if [ -n "$READOUT_B64" ]; then
            ARGS="$ARGS,--weekly-readout-b64,$READOUT_B64"
          fi
          gcloud run jobs execute "$REPORT_JOB" --region="$REGION" \
            --args="$ARGS" --wait
          echo "data-quality report job completed (emails the founder via Resend)"
