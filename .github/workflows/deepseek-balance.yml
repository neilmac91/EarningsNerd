name: DeepSeek balance readout

on:
  # Daily, so a low prepaid balance is seen before it is empty. Nothing in the app caps model spend,
  # and an empty balance stops new summaries, Ask this Filing answers and analysis narratives for
  # every reader (docs/ops/closed-beta-acceptance.md, section 5). A dispatch reads the balance on
  # request, as before, and only warns below the floor.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read available provider balance
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The floor in USD. A repository variable, so the founder moves it without a code change.
          BALANCE_FLOOR_USD: ${{ vars.DEEPSEEK_BALANCE_FLOOR_USD || '5' }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from decimal import Decimal, InvalidOperation

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not key:
              fail("Balance unavailable: DEEPSEEK_API_KEY is not configured.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          request = urllib.request.Request(
              "https://api.deepseek.com/user/balance",
              headers={"Authorization": "Bearer " + key, "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=15) as response:
                  if response.status != 200:
                      fail("Balance unavailable: unexpected HTTP status.")
                  body = response.read(65537)
              if len(body) > 65536:
                  fail("Balance unavailable: response exceeds size limit.")
          except urllib.error.HTTPError as exc:
              fail(f"Balance unavailable: HTTP {exc.code}; check credential, quota or provider status.")
          except (urllib.error.URLError, TimeoutError, OSError, ValueError, http.client.HTTPException):
              fail("Balance unavailable: transport failed or timed out.")

          try:
              payload = json.loads(body)
              if not isinstance(payload, dict) or type(payload.get("is_available")) is not bool:
                  raise ValueError
              rows = payload["balance_infos"]
              if not isinstance(rows, list) or not 1 <= len(rows) <= 10:
                  raise ValueError
              normalized = []
              for row in rows:
                  if not isinstance(row, dict) or row.get("currency") not in ("CNY", "USD"):
                      raise ValueError
                  item = {"currency": row["currency"]}
                  for field in ("total_balance", "granted_balance", "topped_up_balance"):
                      value = row[field]
                      if not isinstance(value, str) or not 1 <= len(value) <= 64:
                          raise ValueError
                      number = Decimal(value)
                      if not number.is_finite() or not -Decimal("1e12") <= number <= Decimal("1e12"):
                          raise ValueError
                      # Bound fixed-point formatting even for hostile exponent strings.
                      if not -12 <= number.as_tuple().exponent <= 12:
                          raise ValueError
                      item[field] = format(number, "f")
                  normalized.append(item)
          except (ValueError, KeyError, TypeError, InvalidOperation, UnicodeError, RecursionError):
              fail("Balance unavailable: provider returned an invalid balance schema.")
          print(json.dumps({"is_available": payload["is_available"], "balance_infos": normalized}))

          # The floor. The scheduled run fails below it, which opens the issue; a dispatch only warns,
          # so a readback before paid work still succeeds on a readable balance.
          try:
              floor = Decimal(os.environ.get("BALANCE_FLOOR_USD", "").strip())
              if not floor.is_finite() or floor < 0:
                  raise ValueError
          except (InvalidOperation, ValueError):
              fail("Balance floor is not a non-negative number: set the DEEPSEEK_BALANCE_FLOOR_USD variable.")
          usd = [Decimal(row["total_balance"]) for row in normalized if row["currency"] == "USD"]
          if not usd:
              print("::notice::No USD balance row, so the floor is not checked.")
          elif usd[0] < floor or not payload["is_available"]:
              low = (
                  f"DeepSeek balance USD {format(usd[0], 'f')} is below the floor of USD {format(floor, 'f')}, "
                  "or the provider reports it unavailable: top up before readers are refused."
              )
              if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
                  print(f"::error::{low}")
                  raise SystemExit(1)
              print(f"::warning::{low}")
          PY

  # The scheduled check's failure, as an issue: the balance is below the floor, or it could not be
  # read (the key, the quota or the provider). One open issue takes each later day's comment.
  report-low-balance:
    needs: balance
    if: always() && github.event_name == 'schedule' && needs.balance.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update a low-balance issue
        shell: bash
        env:
          BALANCE_RESULT: ${{ needs.balance.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="DeepSeek balance check failed $(date -u +%F)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          cat > "$BODY_FILE" <<EOF_BODY
          The daily DeepSeek balance check finished with result $BALANCE_RESULT: $RUN_URL

          Either the prepaid balance is below the floor (the DEEPSEEK_BALANCE_FLOOR_USD repository
          variable, USD 5 when unset) or the balance could not be read (the key, the quota or the
          provider). An empty balance stops new summaries, Ask this Filing answers and analysis
          narratives for every reader; stored summaries still serve. Top up, or repair the read, then
          close this issue.
          EOF_BODY
          EXISTING="$(gh issue list --state open --search '"DeepSeek balance check failed" in:title' --json number,title \
            --jq '[.[] | select(.title | startswith("DeepSeek balance check failed"))] | .[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
