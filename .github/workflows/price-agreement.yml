# Backend first (docs/PRICING_OFFER.md, "Machine checks"): a pricing page must never show less than
# checkout charges. A pull request that changes the offer in frontend/app/pricing/prices.ts is checked
# against what production checkout charges now, read from the backend's public charge report
# (GET /api/subscriptions/prices; no credentials). It fails while the serving backend still charges
# more than the new page would show: bind the lower Prices on the backend first, then re-run this job.
# A raise passes here, because checkout charging less than the page shows overcharges no one; the
# daily agreement check in prod-smoke.yml stays red until the backend charges the new amounts too.
# An unreachable production API fails the job; re-run it. Gate: tests/unit/test_price_agreement_checks.py.
name: Price agreement

on:
  pull_request:
    paths:
      - frontend/app/pricing/prices.ts

permissions:
  contents: read

concurrency:
  group: price-agreement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checkout-charges-no-more:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Read what production checkout charges
        run: |
          curl -fsS --connect-timeout 10 --max-time 30 \
            https://api.earningsnerd.io/api/subscriptions/prices -o "$RUNNER_TEMP/serving-prices.json"
          cat "$RUNNER_TEMP/serving-prices.json"
      - name: Checkout must charge no more than this page shows
        working-directory: frontend
        run: npm run -s check:pricing -- --serving --publishing "$RUNNER_TEMP/serving-prices.json"
