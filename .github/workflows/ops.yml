name: Ops

# Operational workflow for the data-quality remediation (docs/data-quality-investigation.md,
# execution log: docs/data-quality-remediation-log.md).
#
# The remediation is driven from an environment with no direct GCP/Cloud SQL access, so the
# production operations the plan requires (detection SQL snapshots, the ticker repair script, the
# companyfacts resync, env verification) run HERE, with the same keyless WIF auth the deploy-backend
# job already uses. So, since 2026-10-19, does the fiscal-year relabel (P6 of the 2026-10-15 bug
# hunt, docs/fiscal-year-label-repair.md), and so do the bounded quarterly fact repair
# (docs/quarterly-data-repair.md) and the lineage backfill for filing-owned legacy calculations
# (docs/filing-lineage-repair.md). Design constraints:
#   - Enum-selected operations ONLY. No free-form command or SQL inputs; everything executed is
#     committed to the repo (ops/detection/*.sql, backend/scripts/*.py).
#   - Read paths are restricted to app data tables (companies/financial_fact/filings/summaries);
#     detection SQL never touches user/auth/billing tables.
#   - Secrets (DATABASE_URL, PGPASSWORD, INTERNAL_JOB_TOKEN) are masked before first use,
#     mirroring the deploy-backend migrations step.
#   - Every -apply operation (relabel-fy-apply, repair-ticker-apply, reset-filing-summary-apply,
#     repair-quarterly-apply, repair-lineage-apply) waits for the founder's approval before any step
#     runs: the approve-apply job runs in the `ops-apply` environment, whose required reviewer is the
#     founder (Settings > Environments). The ops job runs an -apply only after that job has passed,
#     and only in a run's first attempt: any re-run of an apply writes nothing and fails visibly (the
#     refuse-rerun job), so a retry is a fresh dispatch the founder approves again.
#     A rejected, cancelled or expired approval runs nothing. The run executes the commit main had
#     at dispatch, so an approval given after main has moved is a reason to reject and re-dispatch.
#     The ops job keeps its own OIDC subject: no environment on it. Ungated on purpose:
#     rollback-traffic (an incident rollback must not wait on a person), and sync-companyfacts and
#     backfill-filing-history (writes the app makes on its own).
#     Known limits: the gate binds main's ops.yml, not the credential (WIF trusts every ref, so a
#     workflow on another branch could write unapproved; docs/data-quality-remediation-log.md);
#     approve-apply passes at once when the environment requires no reviewer, so the ops job
#     refuses an apply unless this run records the repository owner's approval of `ops-apply`
#     (fail closed; another reviewer's approval does not count); and
#     sessions act through the founder's account, so .claude/hooks/ops_approval_guard.py refuses a
#     Claude Code session the approval and environment calls, while Codex and Astra load no hooks
#     (AGENTS.md §5).
#   - The ops job's `ops` concurrency group serializes every operation but the two reads below; the
#     approval job sits outside the group, so an apply waiting for approval holds up no other
#     dispatch. Once approved, an apply queues like any dispatch, and GitHub holds ONE pending run per
#     group, so a later pending dispatch replaces it and wastes the approval. The two reads a Claude
#     Code session may dispatch by an exact allow rule (describe-service and logs-probe; F51,
#     docs/OPERATIONS.md) take a group of their own run instead, so a read never queues behind, or
#     replaces, a pending operation; it can overlap one that is running. Deploys keep their own
#     group on purpose: sharing `deploy-backend`'s group would let an ops dispatch silently cancel a
#     queued release. Instead the pre-flight step below refuses to run while a CI run for a push to
#     `main` is in flight (read-only inspection and rollback are exempt); for an apply it runs after
#     the approval.
#     Known limit: the check is point-in-time and one-directional — a main push that lands AFTER
#     it passes can still overlap this run, and a deploy never waits for ops. Do not dispatch
#     write operations when a backend merge is imminent.
#   - Every Cloud SQL step sets PGOPTIONS with a lock_timeout of at most 10s (fail fast, never queue
#     behind a held lock; the capacity ledger uses 2s). statement_timeout is per step: the write
#     paths (the ticker repair, relabel, quarterly repair and lineage backfill scripts) match the
#     deploy migration step (120s); the read-only detection snapshots full-scan financial_fact and get
#     600s. The proxy binary is checksum-pinned (lessons/ops-migrations-need-lock-timeout.md).

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        type: choice
        options:
          - describe-service
          - feedback-media-inspect
          - feedback-media-verify-inspect
          - feedback-media-verify-apply
          - feedback-media-provision-apply
          - feedback-media-enable-apply
          - feedback-media-disable-apply
          - describe-jobs
          - detection-sql
          - logs-probe
          - capacity-readout
          - jobs-channel-noop-probe
          - repair-ticker-dry-run
          - repair-ticker-apply
          - relabel-fy-dry-run
          - relabel-fy-apply
          - repair-quarterly-dry-run
          - repair-quarterly-apply
          - repair-lineage-dry-run
          - repair-lineage-apply
          - sync-companyfacts
          - backfill-filing-history
          - data-quality-report
          - reset-filing-summary-dry-run
          - reset-filing-summary-apply
          - rollback-traffic
      capacity_start:
        description: "Capacity window start (UTC YYYY-MM-DDTHH:MM:SSZ; maximum two hours)"
        required: false
        default: ""
      capacity_end:
        description: "Capacity window end (UTC YYYY-MM-DDTHH:MM:SSZ; must be in the past)"
        required: false
        default: ""
      tickers:
        description: 'Comma-separated tickers: sync-companyfacts; backfill-filing-history (empty = the watchlist cohort); relabel-fy-* (empty = every company); repair-quarterly-* (required, at most 50); repair-lineage-* (empty = every company). A SINGLE ticker for reset-filing-summary'
        required: false
        default: ''
      revision:
        description: 'Cloud Run revision name (rollback-traffic only)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read # pre-flight: list in-flight CI runs on main
  id-token: write # mint the OIDC token Workload Identity Federation exchanges

env:
  REGION: us-west1
  SERVICE: earningsnerd-backend
  JOBS_CHANNEL_JOB: earningsnerd-backfill-facts
  # Same pinned proxy build as ci.yml's migration step (test_migration_lock_safety.py keeps them equal).
  CLOUD_SQL_PROXY_VERSION: v2.14.0
  CLOUD_SQL_PROXY_SHA256: c0af803c07157530c9159b6179e3288298950af5a39c8ca38ad28c8a2b52ae3d

jobs:
  approve-apply:
    # An -apply operation waits here until the founder approves it in GitHub: the `ops-apply`
    # environment names the founder as its required reviewer. Every other operation skips this job.
    if: github.ref == 'refs/heads/main' && contains('relabel-fy-apply repair-ticker-apply reset-filing-summary-apply repair-quarterly-apply repair-lineage-apply feedback-media-provision-apply feedback-media-enable-apply feedback-media-disable-apply feedback-media-verify-apply', inputs.operation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ops-apply
    permissions: {}
    steps:
      - name: Record the approval
        env:
          OP: ${{ inputs.operation }}
        run: echo "ops-apply approval passed for $OP"

  ops:
    # Operations run against production, so only the reviewed definition on main may run: a
    # dispatch from another ref is skipped before any step executes. An -apply operation runs only
    # after approve-apply passes, and only in the run's first attempt (refuse-rerun fails a later
    # one); any other operation runs when approve-apply is skipped.
    needs: approve-apply
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && ((needs.approve-apply.result == 'skipped' && !contains('relabel-fy-apply repair-ticker-apply reset-filing-summary-apply repair-quarterly-apply repair-lineage-apply feedback-media-provision-apply feedback-media-enable-apply feedback-media-disable-apply feedback-media-verify-apply', inputs.operation)) || (needs.approve-apply.result == 'success' && github.run_attempt == '1')) }}
    concurrency:
      # A read (describe-service, logs-probe) runs in its own run's group: it never replaces a pending run,
      # an approved apply's included (test_ops_readback_allow_rules.py pins this).
      group: ${{ (inputs.operation == 'describe-service' || inputs.operation == 'logs-probe') && format('ops-read-{0}', github.run_id) || 'ops' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve requested operation
        id: request
        # Dispatch inputs reach the shell only through env: (never interpolated into the script),
        # so their text can never be parsed as shell before the validation below runs
        # (tests/unit/test_workflow_dispatch_inputs.py).
        env:
          OP: ${{ inputs.operation }}
          TICKERS: ${{ inputs.tickers }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Every input is bounded before any operation-specific check, including the fields the
          # requested operation does not use: the values are written line-by-line to $GITHUB_OUTPUT
          # below, where an unvalidated field could carry extra "name=value" lines and redefine an
          # output a later step relies on.
          [[ "$TICKERS" =~ ^[A-Za-z0-9.,-]*$ ]] \
            || { echo "::error::tickers may contain only letters, digits, '.', '-' and ','"; exit 1; }
          [[ "$REVISION" =~ ^[a-z0-9-]*$ ]] \
            || { echo "::error::revision may contain only lowercase letters, digits and '-'"; exit 1; }
          case "$OP" in
            feedback-media-inspect|feedback-media-provision-apply|feedback-media-enable-apply|feedback-media-disable-apply|feedback-media-verify-inspect|feedback-media-verify-apply|describe-service|describe-jobs|detection-sql|logs-probe|capacity-readout|jobs-channel-noop-probe|repair-ticker-dry-run|repair-ticker-apply|relabel-fy-dry-run|relabel-fy-apply|repair-quarterly-dry-run|repair-quarterly-apply|repair-lineage-dry-run|repair-lineage-apply|sync-companyfacts|backfill-filing-history|data-quality-report|reset-filing-summary-dry-run|reset-filing-summary-apply|rollback-traffic) ;;
            *) echo "::error::unknown operation '$OP'"; exit 1 ;;
          esac
          case "$OP" in
            sync-companyfacts|repair-quarterly-dry-run|repair-quarterly-apply)
              [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]] \
                || { echo "::error::tickers must be a comma-separated symbol list"; exit 1; }
              # Spec P0-3: resync in bounded batches.
              COUNT=$(echo "$TICKERS" | tr ',' '\n' | wc -l)
              [ "$COUNT" -le 50 ] || { echo "::error::max 50 tickers per dispatch"; exit 1; }
              ;;
            backfill-filing-history|relabel-fy-dry-run|relabel-fy-apply|repair-lineage-dry-run|repair-lineage-apply)
              # tickers OPTIONAL (empty => the watchlist cohort for a backfill, every company for a
              # relabel or a lineage backfill); when given, a comma-separated list ≤50.
              if [ -n "$TICKERS" ]; then
                [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]] \
                  || { echo "::error::tickers must be a comma-separated symbol list"; exit 1; }
                COUNT=$(echo "$TICKERS" | tr ',' '\n' | wc -l)
                [ "$COUNT" -le 50 ] || { echo "::error::max 50 tickers per dispatch"; exit 1; }
              fi
              ;;
            reset-filing-summary-dry-run|reset-filing-summary-apply)
              # Per-filing (NOT reset-all): require a SINGLE ticker, no comma-separated list.
              [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+$ ]] \
                || { echo "::error::reset-filing-summary needs exactly one ticker in the tickers field"; exit 1; }
              ;;
            rollback-traffic)
              [[ "$REVISION" =~ ^[a-z0-9-]+$ ]] \
                || { echo "::error::revision must be a Cloud Run revision name"; exit 1; }
              ;;
          esac
          {
            echo "operation=$OP"
            echo "tickers=$TICKERS"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"
          echo "Requested operation: $OP"

      - name: Refuse an apply that no one approved in this run
        # approve-apply passes at once while the ops-apply environment requires no reviewer: before the
        # founder adds one (docs/DEPLOYMENT.md), or after anyone removes it or deletes the environment.
        # So an apply stops here unless this run's review history records an approval of ops-apply: the
        # gate fails closed. It reads the run's approvals, not the environment's settings, which a reviewer added
        # while this job queued behind another dispatch would satisfy with no one having approved. Only the
        # repository owner's approval counts, the founder's, so a reviewer added to ops-apply later cannot
        # approve a production write. The owner's login goes into the filter after a check that it is one.
        if: contains('relabel-fy-apply repair-ticker-apply reset-filing-summary-apply repair-quarterly-apply repair-lineage-apply feedback-media-provision-apply feedback-media-enable-apply feedback-media-disable-apply feedback-media-verify-apply', steps.request.outputs.operation)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$OWNER" in ''|*[!A-Za-z0-9-]*) OWNER='' ;; esac  # not a GitHub login: no approval can match
          APPROVED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq "[.[] | select(.state == \"approved\" and .user.login == \"$OWNER\") | .environments[]? | select(.name == \"ops-apply\")] | length" 2>/dev/null || true)"
          case "$APPROVED" in ''|*[!0-9]*) APPROVED=0 ;; esac  # an unreadable or non-numeric answer counts as none
          if [ "$APPROVED" -lt 1 ]; then
            echo "::error::no approval of ops-apply is recorded for this run from the repository owner ($OWNER): none was given, or the answer could not be read, so this apply stops; docs/DEPLOYMENT.md, \"One-shot maintenance runs\", says how the ops-apply environment is set up"
            exit 1
          fi
          echo "This run records the repository owner's approval of ops-apply; the apply proceeds."

      - name: Refuse to run while a main push (deploy) is in flight
        # deploy-backend (ci.yml) applies migrations to the same database and re-images the jobs this
        # workflow queries and executes. See the header for why this is a check, not a shared
        # concurrency group. A main push whose CI run has not yet decided whether it deploys still
        # counts — waiting ~10 min beats racing a migration.
        if: ${{ !contains('describe-service describe-jobs logs-probe rollback-traffic feedback-media-inspect feedback-media-verify-inspect', steps.request.outputs.operation) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count_runs() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status "$1" --json databaseId --jq 'length'
          }
          ACTIVE="$(count_runs in_progress)"; QUEUED="$(count_runs queued)"
          if [ "$ACTIVE" -gt 0 ] || [ "$QUEUED" -gt 0 ]; then
            echo "::error::a CI run for a push to main is in flight (in_progress=$ACTIVE, queued=$QUEUED); its deploy-backend job may be applying migrations or re-imaging jobs. Wait for it to finish, then re-dispatch."
            exit 1
          fi
          echo "No main push in flight."

      - name: Validate bounded capacity window
        if: steps.request.outputs.operation == 'capacity-readout'
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
        run: python3 ops/capacity/readout.py --start "$CAPACITY_START" --end "$CAPACITY_END" --validate-only

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Manage private feedback media resources
        if: contains('feedback-media-inspect feedback-media-provision-apply feedback-media-enable-apply feedback-media-disable-apply', steps.request.outputs.operation)
        timeout-minutes: 15
        env:
          OP: ${{ steps.request.outputs.operation }}
        run: python3 ops/feedback_media/manage.py "$OP"

      - name: Set up Node for isolated feedback verification
        if: steps.request.outputs.operation == 'feedback-media-verify-apply'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Build the committed feedback verification frontend
        if: steps.request.outputs.operation == 'feedback-media-verify-apply'
        timeout-minutes: 15
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://localhost:8443
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Install the fixed isolated verification SQL proxy
        if: steps.request.outputs.operation == 'feedback-media-verify-apply'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy

      - name: Verify feedback against isolated private storage
        if: contains('feedback-media-verify-inspect feedback-media-verify-apply', steps.request.outputs.operation)
        timeout-minutes: 40
        env:
          OP: ${{ steps.request.outputs.operation }}
          FEEDBACK_VERIFY_DEPLOYER: ${{ vars.GCP_DEPLOYER_SA }}
        run: python3 ops/feedback_media/verify_manage.py "$OP"

      - name: Retain validated synthetic feedback verification evidence
        if: ${{ always() && steps.request.outputs.operation == 'feedback-media-verify-apply' && hashFiles('verification-output/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: feedback-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-output/
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------------ read-only inspection
      - name: Describe service env (values only for known feature flags)
        if: steps.request.outputs.operation == 'describe-service'
        timeout-minutes: 10
        # The module makes every gcloud read itself, the service describe included, and classifies a failed read.
        run: python3 ops/describe/service.py

      - name: Describe expected job release configuration
        if: steps.request.outputs.operation == 'describe-jobs'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          JOB_DIR="$(mktemp -d /tmp/earningsnerd-expected-jobs.XXXXXX)"
          jobs=(
            earningsnerd-pregenerate
            earningsnerd-filing-scan
            earningsnerd-filing-digest
            earningsnerd-backfill-facts
            earningsnerd-earnings-calendar-refresh
            earningsnerd-earnings-day-alerts
            earningsnerd-notable-filings
            earningsnerd-retention-purge
            earningsnerd-feedback-media-cleanup
          )
          for job in "${jobs[@]}"; do
            if ! gcloud run jobs describe "$job" --region="$REGION" --format=json > "$JOB_DIR/$job.json" 2>/dev/null; then
              echo "::error::expected Cloud Run job '$job' is missing or unreadable"
              exit 1
            fi
          done
          export JOB_DIR
          python3 ops/describe/jobs.py

      - name: Logs read probe (safeguard-2 alert feasibility)
        if: steps.request.outputs.operation == 'logs-probe'
        run: |
          set +e
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="earningsnerd-backend"' \
            --freshness=15m --limit=3 --format='value(timestamp)' >/tmp/probe.out 2>/tmp/probe.err
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "logs-probe: logging.read PERMITTED ($(wc -l < /tmp/probe.out) recent entries visible)"
          else
            echo "logs-probe: logging.read DENIED (rc=$RC)"
            # gcloud's error text can name the acting principal: print its closed class, never the text,
            # in the order gcloud_json() in ops/describe/service.py classifies.
            if grep -qsF PERMISSION_DENIED /tmp/probe.err; then CLASS=permission_denied
            elif grep -qsF NOT_FOUND /tmp/probe.err; then CLASS=not_found
            elif grep -qsF -e UNAVAILABLE -e DEADLINE_EXCEEDED /tmp/probe.err; then CLASS=unavailable
            else CLASS="error (gcloud exit $RC)"; fi
            echo "logs-probe: failure class $CLASS (gcloud's error text withheld)"
          fi
          set +e
          gcloud logging read 'jsonPayload.event="company_upsert_conflict" OR textPayload:"company_upsert_conflict"' \
            --freshness=7d --limit=20 --format=json >/tmp/conflicts.json 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "company_upsert_conflict entries in last 7d: $(python3 -c 'import json;print(len(json.load(open("/tmp/conflicts.json"))))' 2>/dev/null || echo 0)"
          fi
          # Sentry at startup: main.py prints one of four lines as an API-service revision starts (the task worker
          # runs task_worker_main.py, which starts Sentry but prints none of them). Name the revisions that printed each in
          # the last seven days, with a count from the newest 500 entries per kind; never a line itself, which can
          # quote an exception. A read that fails prints UNVERIFIED with a closed class, never gcloud's text, and the
          # step adds one warning naming those kinds and the remedy (lessons/ops-denied-reads-report-unverified.md).
          SCOPE='resource.type="cloud_run_revision" AND resource.labels.service_name="earningsnerd-backend"'
          UNVERIFIED=""
          for KIND in "initialized:Sentry error tracking initialized" "failed:Sentry initialization failed" \
              "dsn-unset:SENTRY_DSN not configured" "sdk-missing:Sentry SDK not available"; do
            if gcloud logging read "$SCOPE AND textPayload:\"${KIND#*:}\"" --freshness=7d --limit=500 \
                --format='value(resource.labels.revision_name)' >/tmp/sentry.txt 2>/tmp/sentry.err; then
              echo "sentry startup (7d) ${KIND%%:*}:$(sort /tmp/sentry.txt | uniq -c | awk '{printf " %s x%s", $2, $1} END {if (!NR) printf " none"}')"
            else
              RC=$?
              if grep -qsF PERMISSION_DENIED /tmp/sentry.err; then CLASS=permission_denied
              elif grep -qsF NOT_FOUND /tmp/sentry.err; then CLASS=not_found
              elif grep -qsF -e UNAVAILABLE -e DEADLINE_EXCEEDED /tmp/sentry.err; then CLASS=unavailable
              else CLASS="error (gcloud exit $RC)"; fi
              echo "sentry startup (7d) ${KIND%%:*}: UNVERIFIED ($CLASS; gcloud's error text withheld)"
              UNVERIFIED="$UNVERIFIED ${KIND%%:*}=$CLASS"
            fi
          done
          if [ -n "$UNVERIFIED" ]; then
            echo "::warning::sentry startup UNVERIFIED:$UNVERIFIED. Not evidence that Sentry started or failed; for permission_denied the Ops identity needs its Logging read role, for not_found check the project and the service, otherwise dispatch logs-probe again."
          fi

      - name: Jobs-channel no-op probe (args override on an existing job)
        if: steps.request.outputs.operation == 'jobs-channel-noop-probe'
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
            --args="-c,print('ops jobs-channel noop probe OK')" --wait
          echo "jobs-channel probe: execute --args --wait PERMITTED"

      - name: Read historical capacity evidence
        if: steps.request.outputs.operation == 'capacity-readout'
        timeout-minutes: 16
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
        run: |
          python3 ops/capacity/readout.py --start "$CAPACITY_START" --end "$CAPACITY_END" \
            --region "$REGION" --output capacity-receipt/cloud.json

      # ------------------------------------------------------------------ Cloud SQL access
      - name: Start Cloud SQL proxy and export connection env
        if: contains('detection-sql repair-ticker-dry-run repair-ticker-apply relabel-fy-dry-run relabel-fy-apply repair-quarterly-dry-run repair-quarterly-apply repair-lineage-dry-run repair-lineage-apply capacity-readout', steps.request.outputs.operation)
        # Mirrors the deploy-backend migrations step (ci.yml) — same secret, same masking.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          if DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL 2>/tmp/proxy-secret.err)"; then
            echo "::add-mask::$DB_URL"
          else
            RC=$?
            # Match logs-probe and gcloud_json(): report a closed class, never the diagnostic text.
            if grep -qsF PERMISSION_DENIED /tmp/proxy-secret.err; then CLASS=permission_denied
            elif grep -qsF NOT_FOUND /tmp/proxy-secret.err; then CLASS=not_found
            elif grep -qsF -e UNAVAILABLE -e DEADLINE_EXCEEDED /tmp/proxy-secret.err; then CLASS=unavailable
            else CLASS="error (gcloud exit $RC)"; fi
            echo "::error::Cloud SQL proxy: cannot read DATABASE_URL ($CLASS; gcloud's error text withheld)"
            exit "$RC"
          fi
          CONN="${DB_URL##*host=/cloudsql/}"; CONN="${CONN%%&*}"
          USERPASS="${DB_URL#*://}"; USERPASS="${USERPASS%%@*}"
          PGUSER="${USERPASS%%:*}"
          PGPASSWORD="${USERPASS#*:}"; echo "::add-mask::$PGPASSWORD"
          DBPART="${DB_URL#*@/}"; PGDATABASE="${DBPART%%\?*}"
          LOCAL_URL="postgresql://${PGUSER}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE}"
          echo "::add-mask::$LOCAL_URL"
          {
            echo "PGUSER=$PGUSER"; echo "PGPASSWORD=$PGPASSWORD"; echo "PGDATABASE=$PGDATABASE"
            echo "PGHOST=127.0.0.1"; echo "PGPORT=5432"; echo "DATABASE_URL=$LOCAL_URL"
          } >> "$GITHUB_ENV"
          nohup ./cloud-sql-proxy --port 5432 "$CONN" > /tmp/sql-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Read current connection reserve and bounded job ledger
        if: steps.request.outputs.operation == 'capacity-readout'
        timeout-minutes: 2
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
          PGOPTIONS: -c lock_timeout=2s -c statement_timeout=15s -c default_transaction_read_only=on
        run: |
          set -euo pipefail
          umask 077
          mkdir -p capacity-receipt
          psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -v readout_start="$CAPACITY_START" -v readout_end="$CAPACITY_END" \
            -f ops/capacity/snapshot.sql > capacity-receipt/database.jsonl

      - name: Retain capacity readout
        if: always() && steps.request.outputs.operation == 'capacity-readout'
        uses: actions/upload-artifact@v7
        with:
          name: capacity-readout-${{ github.run_id }}
          path: capacity-receipt/
          retention-days: 14
          if-no-files-found: error

      - name: Run committed detection SQL (read-only snapshots)
        if: steps.request.outputs.operation == 'detection-sql'
        env:
          # Read-only full scans of financial_fact: same fail-fast lock_timeout as the deploy step,
          # a larger statement budget than the 120s write path.
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=600s
        run: |
          set -euo pipefail
          for f in ops/detection/*.sql; do
            echo ""
            echo "===== $(basename "$f") ====="
            psql -v ON_ERROR_STOP=1 -P pager=off -f "$f"
          done

      # ------------------------------------------------------------------ committed scripts (runner)
      - name: Install backend dependencies
        if: contains('repair-ticker-dry-run repair-ticker-apply relabel-fy-dry-run relabel-fy-apply repair-quarterly-dry-run repair-quarterly-apply repair-lineage-dry-run repair-lineage-apply', steps.request.outputs.operation)
        run: |
          pip install -q -r backend/requirements.txt

      - name: Run ticker repair script
        if: contains('repair-ticker-dry-run repair-ticker-apply', steps.request.outputs.operation)
        working-directory: backend
        env:
          # Hermetic dummy env for Settings import (same shape as the CI eval job); DATABASE_URL
          # points at the proxy from the step above. libpq honours PGOPTIONS, so the SQLAlchemy
          # session gets the deploy migration step's guards (fail fast on a held lock; bound writes).
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=120s
          # The SEC budgets every SEC-calling process is pinned to (docs/OPERATIONS.md, D3).
          SEC_RATE_LIMIT_PER_SECOND: '1'
          EDGAR_RATE_LIMIT_PER_SEC: '1'
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: ops-workflow-secret-key-not-used-0123456789
          STRIPE_SECRET_KEY: sk_test_ops
          STRIPE_WEBHOOK_SECRET: whsec_ops
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
          OP: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          [ -f scripts/repair_ticker_by_cik.py ] || { echo "::error::repair script not committed yet"; exit 1; }
          if [ "$OP" = "repair-ticker-apply" ]; then
            python scripts/repair_ticker_by_cik.py --apply
          else
            python scripts/repair_ticker_by_cik.py
          fi

      - name: Run fiscal-year relabel script
        # backend/scripts/relabel_filing_fy_facts.py (docs/fiscal-year-label-repair.md): a dry run reads
        # and prints its plan, one JSON line per company and a summary, in read-only transactions, so
        # Postgres refuses any write it might attempt; the apply writes the plan, one company per
        # transaction under the fact writers' lock, journaled for the audited rollback. Before each
        # company's session opens, it reads that company's companyfacts from SEC (the shared limiter),
        # its evidence where no stored row vouches for a year. It runs here rather than in the jobs
        # channel so its lines reach this log.
        if: contains('relabel-fy-dry-run relabel-fy-apply', steps.request.outputs.operation)
        working-directory: backend
        timeout-minutes: 60
        env:
          # The ticker repair's hermetic env and guards; DATABASE_URL points at the proxy above.
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=120s
          # The SEC budgets every SEC-calling process is pinned to (docs/OPERATIONS.md, D3).
          SEC_RATE_LIMIT_PER_SECOND: '1'
          EDGAR_RATE_LIMIT_PER_SEC: '1'
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: ops-workflow-secret-key-not-used-0123456789
          STRIPE_SECRET_KEY: sk_test_ops
          STRIPE_WEBHOOK_SECRET: whsec_ops
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
          OP: ${{ steps.request.outputs.operation }}
          TICKERS: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          [ -f scripts/relabel_filing_fy_facts.py ] || { echo "::error::relabel script not committed yet"; exit 1; }
          ARGS=()
          READ_ONLY=on
          if [ "$OP" = "relabel-fy-apply" ]; then ARGS+=(--apply); READ_ONLY=off
          else PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on"; fi
          if [ -n "$TICKERS" ]; then ARGS+=(--tickers "$TICKERS"); fi
          # The settings a session gets through the proxy, read back so this log proves them, and
          # compared with this step's, so a lost or weakened guard stops the run before the script.
          SESSION=$(psql -X -t -A -c "SELECT 'session read_only=' || current_setting('default_transaction_read_only') || ' lock_timeout=' || current_setting('lock_timeout') || ' statement_timeout=' || current_setting('statement_timeout')")
          echo "$SESSION"
          EXPECTED="session read_only=$READ_ONLY lock_timeout=10s statement_timeout=2min"
          [ "$SESSION" = "$EXPECTED" ] || { echo "::error::the session's settings are not this step's ($EXPECTED)"; exit 1; }
          python scripts/relabel_filing_fy_facts.py "${ARGS[@]}"

      - name: Run quarterly fact repair script
        id: quarterly
        # backend/scripts/repair_quarterly_facts.py (docs/quarterly-data-repair.md): for each named company
        # it reads companyfacts from SEC (the shared limiter) before the company's session opens, then
        # plans the bounded repair. The preview runs in read-only transactions, so Postgres refuses any
        # write; the apply writes the plan, one company per transaction under the fact writers' lock,
        # journaled in financial_fact_revision for the audited rollback. Before the first company it
        # prints one flushed line with the run_id and the tickers; its JSON report reaches this log and
        # the run's artifact only once the batch ends. So a run cut short (a cancel, this step's timeout)
        # leaves that line alone in this log, while the companies it finished stay committed, and their
        # rollback takes that run_id (docs/quarterly-data-repair.md). Explicit tickers only: the resolve
        # step requires at most 50, and --limit 50 lifts the script's own default of 10 to that bound.
        if: contains('repair-quarterly-dry-run repair-quarterly-apply', steps.request.outputs.operation)
        working-directory: backend
        timeout-minutes: 60
        env:
          # The relabel step's hermetic env and guards; DATABASE_URL points at the proxy above.
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=120s
          # The SEC budgets every SEC-calling process is pinned to (docs/OPERATIONS.md, D3).
          SEC_RATE_LIMIT_PER_SECOND: '1'
          EDGAR_RATE_LIMIT_PER_SEC: '1'
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: ops-workflow-secret-key-not-used-0123456789
          STRIPE_SECRET_KEY: sk_test_ops
          STRIPE_WEBHOOK_SECRET: whsec_ops
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
          OP: ${{ steps.request.outputs.operation }}
          TICKERS: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          [ -f scripts/repair_quarterly_facts.py ] || { echo "::error::quarterly repair script not committed yet"; exit 1; }
          [ -n "$TICKERS" ] || { echo "::error::tickers input required"; exit 1; }
          REPORT_DIR="$RUNNER_TEMP/quarterly-repair"
          mkdir -p "$REPORT_DIR"
          ARGS=(--tickers "$TICKERS" --limit 50 --output "$REPORT_DIR/report.json")
          READ_ONLY=on
          if [ "$OP" = "repair-quarterly-apply" ]; then ARGS+=(--apply); READ_ONLY=off
          else PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on"; fi
          # The settings a session gets through the proxy, read back so this log proves them, and
          # compared with this step's, so a lost or weakened guard stops the run before the script.
          SESSION=$(psql -X -t -A -c "SELECT 'session read_only=' || current_setting('default_transaction_read_only') || ' lock_timeout=' || current_setting('lock_timeout') || ' statement_timeout=' || current_setting('statement_timeout')")
          echo "$SESSION"
          EXPECTED="session read_only=$READ_ONLY lock_timeout=10s statement_timeout=2min"
          [ "$SESSION" = "$EXPECTED" ] || { echo "::error::the session's settings are not this step's ($EXPECTED)"; exit 1; }
          python scripts/repair_quarterly_facts.py "${ARGS[@]}"

      - name: Retain quarterly repair report
        # Whenever the repair step ran, whatever its result, and only then. Not the operation test the
        # other steps use: after a failed resolve step the operation output is '', and contains() finds
        # '' in any string, so that test would pass for every operation.
        if: always() && steps.quarterly.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: quarterly-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/quarterly-repair/
          retention-days: 30
          if-no-files-found: warn

      - name: Run filing lineage backfill script
        # backend/scripts/repair_filing_lineage.py (docs/filing-lineage-repair.md): gives filing-owned
        # legacy calculations their lineage record. A dry run reads and prints its plan, a start line,
        # one JSON line per company and a summary, in read-only transactions, so Postgres refuses any
        # write it might attempt; the apply writes provenance and reconciled only, one company per
        # transaction under the fact writers' lock, journaled for the audited rollback. It reads
        # nothing from SEC; the SEC budgets are pinned as on every script step. It runs here rather than
        # in the jobs channel so its lines reach this log.
        if: contains('repair-lineage-dry-run repair-lineage-apply', steps.request.outputs.operation)
        working-directory: backend
        timeout-minutes: 60
        env:
          # The relabel step's hermetic env and guards; DATABASE_URL points at the proxy above.
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=120s
          # The SEC budgets every SEC-calling process is pinned to (docs/OPERATIONS.md, D3).
          SEC_RATE_LIMIT_PER_SECOND: '1'
          EDGAR_RATE_LIMIT_PER_SEC: '1'
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: ops-workflow-secret-key-not-used-0123456789
          STRIPE_SECRET_KEY: sk_test_ops
          STRIPE_WEBHOOK_SECRET: whsec_ops
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
          OP: ${{ steps.request.outputs.operation }}
          TICKERS: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          [ -f scripts/repair_filing_lineage.py ] || { echo "::error::lineage backfill script not committed yet"; exit 1; }
          ARGS=()
          READ_ONLY=on
          if [ "$OP" = "repair-lineage-apply" ]; then ARGS+=(--apply); READ_ONLY=off
          else PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on"; fi
          if [ -n "$TICKERS" ]; then ARGS+=(--tickers "$TICKERS"); fi
          # The settings a session gets through the proxy, read back so this log proves them, and
          # compared with this step's, so a lost or weakened guard stops the run before the script.
          SESSION=$(psql -X -t -A -c "SELECT 'session read_only=' || current_setting('default_transaction_read_only') || ' lock_timeout=' || current_setting('lock_timeout') || ' statement_timeout=' || current_setting('statement_timeout')")
          echo "$SESSION"
          EXPECTED="session read_only=$READ_ONLY lock_timeout=10s statement_timeout=2min"
          [ "$SESSION" = "$EXPECTED" ] || { echo "::error::the session's settings are not this step's ($EXPECTED)"; exit 1; }
          python scripts/repair_filing_lineage.py "${ARGS[@]}"

      # ------------------------------------------------------------------ internal jobs
      - name: Trigger companyfacts resync (internal endpoint; jobs-channel fallback)
        if: steps.request.outputs.operation == 'sync-companyfacts'
        env:
          TICKERS: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          [ -n "$TICKERS" ] || { echo "::error::tickers input required"; exit 1; }
          TOKEN="$(gcloud secrets versions access latest --secret=INTERNAL_JOB_TOKEN 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'tickers': sys.argv[1].split(','), 'force': True}))" "$TICKERS")
            curl -fsS -X POST "https://api.earningsnerd.io/internal/jobs/sync-companyfacts" \
              -H "X-Internal-Token: ${TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo ""
            echo "resync ACCEPTED via internal endpoint for: $TICKERS (runs in the service background)"
          else
            echo "INTERNAL_JOB_TOKEN not accessible to this SA — using the documented jobs channel."
            # gcloud --args is comma-delimited; the ^;^ prefix switches the delimiter to ';' so
            # the comma-separated ticker LIST survives as a single --tickers value (else only the
            # first ticker would be received and the rest parsed as stray args).
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/sync_companyfacts.py;--tickers;${TICKERS};--force" --wait
            echo "resync COMPLETED via jobs channel for: $TICKERS"
          fi

      - name: Trigger filing-history backfill (internal endpoint; jobs-channel fallback)
        if: steps.request.outputs.operation == 'backfill-filing-history'
        env:
          TICKERS: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud secrets versions access latest --secret=INTERNAL_JOB_TOKEN 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            if [ -n "$TICKERS" ]; then
              PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'tickers': sys.argv[1].split(',')}))" "$TICKERS")
            else
              PAYLOAD='{"watchlist_only": true}'
            fi
            curl -fsS -X POST "https://api.earningsnerd.io/internal/jobs/backfill-filing-history" \
              -H "X-Internal-Token: ${TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo ""
            echo "backfill-filing-history ACCEPTED via internal endpoint for: ${TICKERS:-watchlist} (runs in the service background)"
          else
            echo "INTERNAL_JOB_TOKEN not accessible to this SA — using the documented jobs channel."
            # The walk reads ENABLE_FPI_FILINGS in the process that runs it, and this job's deploy map
            # does not set it: this execution takes the service's value, so it walks a foreign issuer's
            # 20-F/40-F as the service does instead of stamping the issuer without them
            # (backend/tests/unit/test_filing_history_service.py pins the values alike).
            if [ -n "$TICKERS" ]; then
              # ^;^ switches gcloud's --args delimiter to ';' so the comma-separated ticker LIST
              # survives as a single --tickers value.
              gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
                --update-env-vars=ENABLE_FPI_FILINGS=true \
                --args="^;^scripts/backfill_filing_history.py;--tickers;${TICKERS}" --wait
            else
              gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
                --update-env-vars=ENABLE_FPI_FILINGS=true \
                --args="scripts/backfill_filing_history.py,--watchlist-only" --wait
            fi
            echo "backfill-filing-history COMPLETED via jobs channel for: ${TICKERS:-watchlist}"
          fi

      - name: Run the weekly data-quality report once (P1-9; jobs channel)
        if: steps.request.outputs.operation == 'data-quality-report'
        run: |
          set -euo pipefail
          # Same payload as .github/workflows/data-quality-weekly.yml: fire the report script inside
          # earningsnerd-filing-digest — the only job carrying both DATABASE_URL and RESEND_API_KEY
          # (Phase-0 probe). The job's entrypoint is `python`; --args appends the script path. Script
          # stdout lands in Cloud Run logs, not here — a green --wait means it built the report and
          # emailed the founder without error. Use this for a one-shot/ad-hoc fire; the scheduled
          # weekly run is driven by data-quality-weekly.yml's cron.
          gcloud run jobs execute earningsnerd-filing-digest --region="$REGION" \
            --args="scripts/data_quality_report.py" --wait
          echo "data-quality report COMPLETED via jobs channel (emails the founder via Resend)"

      - name: Reset a single filing's summary (per-filing regen; jobs channel)
        if: contains('reset-filing-summary-dry-run reset-filing-summary-apply', steps.request.outputs.operation)
        env:
          OP: ${{ steps.request.outputs.operation }}
          TICKER: ${{ steps.request.outputs.tickers }}
        run: |
          set -euo pipefail
          [ -n "$TICKER" ] || { echo "::error::a single ticker is required in the tickers field"; exit 1; }
          # Runs the committed per-filing reset in the jobs-channel container (which carries
          # DATABASE_URL). ^;^ switches gcloud's --args delimiter to ';' so each flag stays separate.
          # The script defaults to a dry run; --execute is added only for the -apply operation.
          if [ "$OP" = "reset-filing-summary-apply" ]; then
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/reset_filing_summary.py;--ticker;${TICKER};--form;10-K;--execute" --wait
            echo "reset-filing-summary APPLIED via jobs channel for: ${TICKER} 10-K (regenerates lazily on next view)"
          else
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/reset_filing_summary.py;--ticker;${TICKER};--form;10-K" --wait
            echo "reset-filing-summary DRY RUN via jobs channel for: ${TICKER} 10-K"
          fi

      # ------------------------------------------------------------------ emergency rollback
      - name: Roll service traffic back to a named revision
        if: steps.request.outputs.operation == 'rollback-traffic'
        env:
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="${REVISION}=100"
          echo "traffic pinned to ${REVISION} — remember to re-run update-traffic --to-latest after the fix deploys"

  refuse-rerun:
    # A re-run of an -apply writes nothing: the ops job runs an apply only in a run's first attempt,
    # so a re-run skips it, and GitHub would then mark the run green, which is easy to report as done.
    # This job fails such a re-run instead, so it reads as a refusal, not a success. GitHub re-runs a
    # job's dependents with it, so "Re-run failed jobs" re-runs this job with ops; a first attempt,
    # and every other operation, skips it.
    needs: ops
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.run_attempt != '1' && contains('relabel-fy-apply repair-ticker-apply reset-filing-summary-apply repair-quarterly-apply repair-lineage-apply feedback-media-provision-apply feedback-media-enable-apply feedback-media-disable-apply feedback-media-verify-apply', inputs.operation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a re-run of an apply
        env:
          OP: ${{ inputs.operation }}
        run: |
          echo "::error::a re-run of $OP writes nothing: an apply runs only in a run's first attempt, so dispatch it again and approve the new run"
          exit 1
