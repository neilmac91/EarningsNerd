name: Ops

# Operational workflow for the data-quality remediation (docs/data-quality-investigation.md,
# execution log: docs/data-quality-remediation-log.md).
#
# The remediation is driven from an environment with no direct GCP/Cloud SQL access, so the
# production operations the plan requires (detection SQL snapshots, the ticker repair script,
# the companyfacts resync, env verification) run HERE, with the same keyless WIF auth the
# deploy-backend job already uses. Design constraints:
#   - Enum-selected operations ONLY. No free-form command or SQL inputs; everything executed is
#     committed to the repo (ops/detection/*.sql, backend/scripts/*.py).
#   - Read paths are restricted to app data tables (companies/financial_fact/filings/summaries);
#     detection SQL never touches user/auth/billing tables.
#   - Secrets (DATABASE_URL, PGPASSWORD, INTERNAL_JOB_TOKEN) are masked before first use,
#     mirroring the deploy-backend migrations step.
#   - `concurrency: ops` serializes ops runs. Deploys keep their own group on purpose: GitHub holds
#     ONE pending run per group, so sharing `deploy-backend`'s group would let an ops dispatch
#     silently cancel a queued release. Instead the pre-flight step below refuses to run while a
#     CI run for a push to `main` is in flight (read-only inspection and rollback are exempt).
#     Known limit: the check is point-in-time and one-directional — a main push that lands AFTER
#     it passes can still overlap this run, and a deploy never waits for ops. Do not dispatch
#     write operations when a backend merge is imminent.
#   - Every Cloud SQL step sets PGOPTIONS with lock_timeout=10s (fail fast, never queue behind a
#     held lock). statement_timeout is per step: the write path (repair script) matches the deploy
#     migration step (120s); the read-only detection snapshots full-scan financial_fact and get
#     600s. The proxy binary is checksum-pinned (lessons/ops-migrations-need-lock-timeout.md).

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        type: choice
        options:
          - describe-service
          - describe-jobs
          - detection-sql
          - logs-probe
          - capacity-readout
          - jobs-channel-noop-probe
          - repair-ticker-dry-run
          - repair-ticker-apply
          - sync-companyfacts
          - backfill-filing-history
          - data-quality-report
          - reset-filing-summary-dry-run
          - reset-filing-summary-apply
          - rollback-traffic
      capacity_start:
        description: "Capacity window start (UTC YYYY-MM-DDTHH:MM:SSZ; maximum two hours)"
        required: false
        default: ""
      capacity_end:
        description: "Capacity window end (UTC YYYY-MM-DDTHH:MM:SSZ; must be in the past)"
        required: false
        default: ""
      tickers:
        description: 'Comma-separated tickers (sync-companyfacts / backfill-filing-history); a SINGLE ticker for reset-filing-summary'
        required: false
        default: ''
      revision:
        description: 'Cloud Run revision name (rollback-traffic only)'
        required: false
        default: ''

concurrency:
  group: ops
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # pre-flight: list in-flight CI runs on main
  id-token: write # mint the OIDC token Workload Identity Federation exchanges

env:
  REGION: us-west1
  SERVICE: earningsnerd-backend
  JOBS_CHANNEL_JOB: earningsnerd-backfill-facts
  # Same pinned proxy build as ci.yml's migration step (test_migration_lock_safety.py keeps them equal).
  CLOUD_SQL_PROXY_VERSION: v2.14.0
  CLOUD_SQL_PROXY_SHA256: c0af803c07157530c9159b6179e3288298950af5a39c8ca38ad28c8a2b52ae3d

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve requested operation
        id: request
        run: |
          set -euo pipefail
          OP="${{ inputs.operation }}"
          TICKERS="${{ inputs.tickers }}"
          REVISION="${{ inputs.revision }}"
          case "$OP" in
            describe-service|describe-jobs|detection-sql|logs-probe|capacity-readout|jobs-channel-noop-probe|repair-ticker-dry-run|repair-ticker-apply|sync-companyfacts|backfill-filing-history|data-quality-report|reset-filing-summary-dry-run|reset-filing-summary-apply|rollback-traffic) ;;
            *) echo "::error::unknown operation '$OP'"; exit 1 ;;
          esac
          case "$OP" in
            sync-companyfacts)
              [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]] \
                || { echo "::error::tickers must be a comma-separated symbol list"; exit 1; }
              # Spec P0-3: resync in bounded batches.
              COUNT=$(echo "$TICKERS" | tr ',' '\n' | wc -l)
              [ "$COUNT" -le 50 ] || { echo "::error::max 50 tickers per dispatch"; exit 1; }
              ;;
            backfill-filing-history)
              # tickers OPTIONAL (empty => watchlist cohort); when given, a comma-separated list ≤50.
              if [ -n "$TICKERS" ]; then
                [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]] \
                  || { echo "::error::tickers must be a comma-separated symbol list"; exit 1; }
                COUNT=$(echo "$TICKERS" | tr ',' '\n' | wc -l)
                [ "$COUNT" -le 50 ] || { echo "::error::max 50 tickers per dispatch"; exit 1; }
              fi
              ;;
            reset-filing-summary-dry-run|reset-filing-summary-apply)
              # Per-filing (NOT reset-all): require a SINGLE ticker, no comma-separated list.
              [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+$ ]] \
                || { echo "::error::reset-filing-summary needs exactly one ticker in the tickers field"; exit 1; }
              ;;
            rollback-traffic)
              [[ "$REVISION" =~ ^[a-z0-9-]+$ ]] \
                || { echo "::error::revision must be a Cloud Run revision name"; exit 1; }
              ;;
          esac
          {
            echo "operation=$OP"
            echo "tickers=$TICKERS"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"
          echo "Requested operation: $OP"

      - name: Refuse to run while a main push (deploy) is in flight
        # deploy-backend (ci.yml) applies migrations to the same database and re-images the jobs this
        # workflow queries and executes. See the header for why this is a check, not a shared
        # concurrency group. A main push whose CI run has not yet decided whether it deploys still
        # counts — waiting ~10 min beats racing a migration.
        if: ${{ !contains('describe-service describe-jobs logs-probe rollback-traffic', steps.request.outputs.operation) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count_runs() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status "$1" --json databaseId --jq 'length'
          }
          ACTIVE="$(count_runs in_progress)"; QUEUED="$(count_runs queued)"
          if [ "$ACTIVE" -gt 0 ] || [ "$QUEUED" -gt 0 ]; then
            echo "::error::a CI run for a push to main is in flight (in_progress=$ACTIVE, queued=$QUEUED); its deploy-backend job may be applying migrations or re-imaging jobs. Wait for it to finish, then re-dispatch."
            exit 1
          fi
          echo "No main push in flight."

      - name: Validate bounded capacity window
        if: steps.request.outputs.operation == 'capacity-readout'
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
        run: python3 ops/capacity/readout.py --start "$CAPACITY_START" --end "$CAPACITY_END" --validate-only

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # ------------------------------------------------------------------ read-only inspection
      - name: Describe service env (values only for known feature flags)
        if: steps.request.outputs.operation == 'describe-service'
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --region="$REGION" --format=json > /tmp/svc.json
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          svc = json.load(open("/tmp/svc.json"))
          status = svc["status"]
          latest = status.get("latestReadyRevisionName")
          traffic = [target for target in status.get("traffic", []) if target.get("percent", 0) > 0]
          print("Serving traffic:", traffic)
          if (not latest or status.get("latestCreatedRevisionName") != latest
                  or len(traffic) != 1 or traffic[0].get("percent") != 100
                  or traffic[0].get("revisionName") != latest):
              raise SystemExit("Unresolved production configuration: require 100% traffic on the latest ready revision.")
          def describe(kind, name):
              return json.loads(subprocess.check_output([
                  "gcloud", "run", kind, "describe", name,
                  "--region=" + os.environ["REGION"], "--format=json",
              ], text=True))
          revision = describe("revisions", latest)
          pregenerate = describe("jobs", "earningsnerd-pregenerate")
          # Only these non-sensitive flag/config values are echoed; everything else is name-only.
          allow = {
              "USE_STATEMENT_FINANCIALS", "ENABLE_FPI_FILINGS",
              "STREAM_SECTION_REVEAL", "AI_DEFAULT_MODEL", "OPENAI_BASE_URL", "ENVIRONMENT",
              "TRUSTED_PROXY_HOPS", "COOKIE_DOMAIN",
              "NOTABLE_FILINGS_ENABLED", "AI_EVIDENCE_SNAP", "AI_FIGURE_TRACE_GATE",
              "AI_FORWARD_QUOTE_GATE", "AI_ATTRIBUTION_GATE", "AI_ATTRIBUTION_VERIFY",
              "USE_STRUCTURED_OUTPUT", "CALENDAR_INDEX_FILTER_ENABLED",
              "REGISTRATION_MODE", "AI_FALLBACK_MODEL", "AI_FALLBACK_BASE_URL",
              "SENTRY_RELEASE", "DB_POOL_SIZE", "DB_MAX_OVERFLOW",
          }
          # Defaults from app/config.py; never include credentials in this allow-list.
          flag_defaults = {
              "USE_STATEMENT_FINANCIALS": True,
              "ENABLE_FPI_FILINGS": False,
              "STREAM_SECTION_REVEAL": False,
              "NOTABLE_FILINGS_ENABLED": False,
              "AI_EVIDENCE_SNAP": False,
              "AI_FIGURE_TRACE_GATE": False,
              "AI_FORWARD_QUOTE_GATE": False,
              "AI_ATTRIBUTION_GATE": False,
              "AI_ATTRIBUTION_VERIFY": False,
              "USE_STRUCTURED_OUTPUT": False,
              "CALENDAR_INDEX_FILTER_ENABLED": False,
              "REGISTRATION_MODE": "public",
              "AI_FALLBACK_MODEL": "",
              "AI_FALLBACK_BASE_URL": "",
          }
          def show(label, containers):
              if len(containers) != 1:
                  raise SystemExit(f"Unresolved production configuration: {label} needs one application container.")
              print(label)
              print("image:", containers[0]["image"])
              print("Absent values below use checkout Settings defaults; verify these against the reported image before pinning.")
              seen = set()
              for e in containers[0].get("env", []):
                  name = e.get("name", "?")
                  seen.add(name)
                  if "valueFrom" in e or "valueSource" in e:
                      print(f"{name} = <secret-ref>")
                  elif name in allow:
                      print(f"{name} = {e.get('value')!r}")
                  else:
                      print(f"{name} = <set; value withheld>")
              for flag, default in flag_defaults.items():
                  if flag not in seen:
                      message = "Settings default applies (True)" if default is True else f"Settings default applies ({default!r})"
                      print(f"{flag} = <NOT SET -> {message}>")
          show("Serving revision: " + latest, revision["spec"]["containers"])
          show("Job: earningsnerd-pregenerate", pregenerate["spec"]["template"]["spec"]["template"]["spec"]["containers"])
          service_max = svc.get("metadata", {}).get("annotations", {}).get("run.googleapis.com/maxScale")
          revision_max = revision.get("metadata", {}).get("annotations", {}).get("autoscaling.knative.dev/maxScale")
          print("Service maxScale:", service_max)
          print("Revision maxScale:", revision_max)
          # Capacity inputs only: never print arbitrary command arguments or worker env text.
          # An absent override is not evidence of the image's effective command or worker count.
          container = revision["spec"]["containers"][0]
          command = container.get("command") or []
          args = container.get("args") or []
          safe_tokens = {
              "uvicorn", "python", "python3", "-m", "main:app", "--host", "0.0.0.0",
              "--port", "8080", "${PORT}", "$PORT", "--proxy-headers",
              "--forwarded-allow-ips=*", "--forwarded-allow-ips", "*", "--workers",
          }
          def safe_token(value):
              return isinstance(value, str) and (
                  value in safe_tokens or re.fullmatch(r"[1-9][0-9]{0,2}", value)
                  or re.fullmatch(r"--workers=[1-9][0-9]{0,2}", value)
              )
          command_evidence = {"state": "image_default_unresolved"}
          if command or args:
              if len(command) + len(args) <= 30 and all(safe_token(v) for v in command + args):
                  command_evidence = {"state": "explicit_allowlisted_tokens", "command": command, "args": args}
              else:
                  command_evidence = {"state": "override_present_values_withheld"}
          env_by_name = {entry.get("name"): entry for entry in container.get("env", [])}
          worker_env = {}
          for name in ("WEB_CONCURRENCY", "UVICORN_WORKERS"):
              entry = env_by_name.get(name)
              if entry is None:
                  worker_env[name] = {"state": "not_set"}
              elif "valueFrom" in entry or "valueSource" in entry:
                  worker_env[name] = {"state": "secret_ref_unresolved"}
              elif re.fullmatch(r"[1-9][0-9]{0,2}", str(entry.get("value", ""))):
                  worker_env[name] = {"state": "literal", "value": int(entry["value"])}
              else:
                  worker_env[name] = {"state": "present_unresolved_value_withheld"}
          annotations = revision.get("metadata", {}).get("annotations", {})
          egress = annotations.get("run.googleapis.com/vpc-access-egress")
          ingress = svc.get("metadata", {}).get("annotations", {}).get("run.googleapis.com/ingress")
          capacity_config = {
              "revision": latest,
              "container_command": command_evidence,
              "worker_environment": worker_env,
              "gunicorn_args_present_value_withheld": "GUNICORN_CMD_ARGS" in env_by_name,
              "container_concurrency": revision["spec"].get("containerConcurrency"),
              "request_timeout_seconds": revision["spec"].get("timeoutSeconds"),
              "vpc_egress": egress if egress in ("all-traffic", "private-ranges-only") else "unset_or_unresolved",
              "vpc_connector_annotation_present": "run.googleapis.com/vpc-access-connector" in annotations,
              "direct_vpc_annotation_present": "run.googleapis.com/network-interfaces" in annotations,
              "ingress": ingress if ingress in ("all", "internal", "internal-and-cloud-load-balancing") else "unset_or_unresolved",
              "effective_worker_count": None,
              "egress_ip_identity": None,
              "limit": "Configured inputs only; image defaults, running process count, egress IP and instantaneous rollout overlap are not measured.",
          }
          print("Capacity configuration:", json.dumps(capacity_config, sort_keys=True))
          PY

      - name: Describe expected job release configuration
        if: steps.request.outputs.operation == 'describe-jobs'
        run: |
          set -euo pipefail
          JOB_DIR="$(mktemp -d /tmp/earningsnerd-expected-jobs.XXXXXX)"
          jobs=(
            earningsnerd-pregenerate
            earningsnerd-filing-scan
            earningsnerd-filing-digest
            earningsnerd-backfill-facts
            earningsnerd-earnings-calendar-refresh
            earningsnerd-earnings-day-alerts
            earningsnerd-notable-filings
            earningsnerd-retention-purge
          )
          for job in "${jobs[@]}"; do
            if ! gcloud run jobs describe "$job" --region="$REGION" --format=json > "$JOB_DIR/$job.json"; then
              echo "::error::expected Cloud Run job '$job' is missing or unreadable"
              exit 1
            fi
          done
          export JOB_DIR
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_pools = {
              "earningsnerd-pregenerate": "3",
              "earningsnerd-filing-scan": "1",
              "earningsnerd-filing-digest": "1",
              "earningsnerd-backfill-facts": "1",
              "earningsnerd-earnings-calendar-refresh": "1",
              "earningsnerd-earnings-day-alerts": "1",
              "earningsnerd-notable-filings": "1",
              "earningsnerd-retention-purge": "1",
          }
          images = set()
          for name, expected_pool in expected_pools.items():
              path = Path(os.environ["JOB_DIR"]) / f"{name}.json"
              try:
                  job = json.loads(path.read_text())
                  task_spec = job["spec"]["template"]["spec"]
                  containers = task_spec["template"]["spec"]["containers"]
              except (OSError, json.JSONDecodeError, KeyError, TypeError) as exc:
                  raise SystemExit(f"Unresolved production configuration: cannot read {name}: {exc}") from exc
              if job.get("metadata", {}).get("name") not in (None, name):
                  raise SystemExit(f"Unresolved production configuration: response name does not match {name}.")
              if len(containers) != 1:
                  raise SystemExit(f"Unresolved production configuration: {name} needs one application container.")
              container = containers[0]
              env = {}
              env_kinds = []
              for entry in container.get("env", []):
                  env_name = entry.get("name")
                  if not env_name or env_name in env:
                      raise SystemExit(f"Unresolved production configuration: {name} has a missing or duplicate env name.")
                  env[env_name] = entry
                  kind = "secret-ref" if ("valueFrom" in entry or "valueSource" in entry) else "plain"
                  env_kinds.append(f"{env_name}({kind})")
              values = {}
              for env_name in ("DB_POOL_SIZE", "DB_MAX_OVERFLOW"):
                  entry = env.get(env_name)
                  if not entry or "valueFrom" in entry or "valueSource" in entry or "value" not in entry:
                      raise SystemExit(f"Unresolved production configuration: {name} needs plain {env_name}.")
                  values[env_name] = str(entry["value"])
              if values != {"DB_POOL_SIZE": expected_pool, "DB_MAX_OVERFLOW": "0"}:
                  raise SystemExit(
                      f"Unresolved production configuration: {name} pool must be "
                      f"{expected_pool}+0, got {values['DB_POOL_SIZE']}+{values['DB_MAX_OVERFLOW']}."
                  )
              task_count = task_spec.get("taskCount")
              if str(task_count) != "1":
                  raise SystemExit(f"Unresolved production configuration: {name} taskCount must be 1.")
              image = container.get("image")
              if not isinstance(image, str) or not image:
                  raise SystemExit(f"Unresolved production configuration: {name} image is missing.")
              images.add(image)
              print(f"== {name}")
              print("  image:", image)
              print("  taskCount:", task_count)
              print("  DB_POOL_SIZE:", values["DB_POOL_SIZE"])
              print("  DB_MAX_OVERFLOW:", values["DB_MAX_OVERFLOW"])
              print("  command:", container.get("command"))
              print("  args:", container.get("args"))
              print("  env:", ", ".join(env_kinds) if env_kinds else "(none)")
          if len(images) != 1:
              raise SystemExit("Unresolved production configuration: expected jobs do not share one release image.")
          print("All expected jobs use one release image with the production pool budget and taskCount=1.")
          PY

      - name: Logs read probe (safeguard-2 alert feasibility)
        if: steps.request.outputs.operation == 'logs-probe'
        run: |
          set +e
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="earningsnerd-backend"' \
            --freshness=15m --limit=3 --format='value(timestamp)' >/tmp/probe.out 2>/tmp/probe.err
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "logs-probe: logging.read PERMITTED ($(wc -l < /tmp/probe.out) recent entries visible)"
          else
            echo "logs-probe: logging.read DENIED (rc=$RC)"; cat /tmp/probe.err
          fi
          set +e
          gcloud logging read 'jsonPayload.event="company_upsert_conflict" OR textPayload:"company_upsert_conflict"' \
            --freshness=7d --limit=20 --format=json >/tmp/conflicts.json 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "company_upsert_conflict entries in last 7d: $(python3 -c 'import json;print(len(json.load(open("/tmp/conflicts.json"))))' 2>/dev/null || echo 0)"
          fi

      - name: Jobs-channel no-op probe (args override on an existing job)
        if: steps.request.outputs.operation == 'jobs-channel-noop-probe'
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
            --args="-c,print('ops jobs-channel noop probe OK')" --wait
          echo "jobs-channel probe: execute --args --wait PERMITTED"

      - name: Read historical capacity evidence
        if: steps.request.outputs.operation == 'capacity-readout'
        timeout-minutes: 12
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
        run: |
          python3 ops/capacity/readout.py --start "$CAPACITY_START" --end "$CAPACITY_END" \
            --region "$REGION" --output capacity-receipt/cloud.json

      # ------------------------------------------------------------------ Cloud SQL access
      - name: Start Cloud SQL proxy and export connection env
        if: contains('detection-sql repair-ticker-dry-run repair-ticker-apply capacity-readout', steps.request.outputs.operation)
        # Mirrors the deploy-backend migrations step (ci.yml) — same secret, same masking.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL)"
          echo "::add-mask::$DB_URL"
          CONN="${DB_URL##*host=/cloudsql/}"; CONN="${CONN%%&*}"
          USERPASS="${DB_URL#*://}"; USERPASS="${USERPASS%%@*}"
          PGUSER="${USERPASS%%:*}"
          PGPASSWORD="${USERPASS#*:}"; echo "::add-mask::$PGPASSWORD"
          DBPART="${DB_URL#*@/}"; PGDATABASE="${DBPART%%\?*}"
          LOCAL_URL="postgresql://${PGUSER}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE}"
          echo "::add-mask::$LOCAL_URL"
          {
            echo "PGUSER=$PGUSER"; echo "PGPASSWORD=$PGPASSWORD"; echo "PGDATABASE=$PGDATABASE"
            echo "PGHOST=127.0.0.1"; echo "PGPORT=5432"; echo "DATABASE_URL=$LOCAL_URL"
          } >> "$GITHUB_ENV"
          nohup ./cloud-sql-proxy --port 5432 "$CONN" > /tmp/sql-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Read current connection reserve and bounded job ledger
        if: steps.request.outputs.operation == 'capacity-readout'
        timeout-minutes: 2
        env:
          CAPACITY_START: ${{ inputs.capacity_start }}
          CAPACITY_END: ${{ inputs.capacity_end }}
          PGOPTIONS: -c lock_timeout=2s -c statement_timeout=15s -c default_transaction_read_only=on
        run: |
          set -euo pipefail
          umask 077
          mkdir -p capacity-receipt
          psql -X -q -t -A -v ON_ERROR_STOP=1 \
            -v readout_start="$CAPACITY_START" -v readout_end="$CAPACITY_END" \
            -f ops/capacity/snapshot.sql > capacity-receipt/database.jsonl

      - name: Retain capacity readout
        if: always() && steps.request.outputs.operation == 'capacity-readout'
        uses: actions/upload-artifact@v7
        with:
          name: capacity-readout-${{ github.run_id }}
          path: capacity-receipt/
          retention-days: 14
          if-no-files-found: error

      - name: Run committed detection SQL (read-only snapshots)
        if: steps.request.outputs.operation == 'detection-sql'
        env:
          # Read-only full scans of financial_fact: same fail-fast lock_timeout as the deploy step,
          # a larger statement budget than the 120s write path.
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=600s
        run: |
          set -euo pipefail
          for f in ops/detection/*.sql; do
            echo ""
            echo "===== $(basename "$f") ====="
            psql -v ON_ERROR_STOP=1 -P pager=off -f "$f"
          done

      # ------------------------------------------------------------------ committed scripts (runner)
      - name: Install backend dependencies
        if: contains('repair-ticker-dry-run repair-ticker-apply', steps.request.outputs.operation)
        run: |
          pip install -q -r backend/requirements.txt

      - name: Run ticker repair script
        if: contains('repair-ticker-dry-run repair-ticker-apply', steps.request.outputs.operation)
        working-directory: backend
        env:
          # Hermetic dummy env for Settings import (same shape as the CI eval job); DATABASE_URL
          # points at the proxy from the step above. libpq honours PGOPTIONS, so the SQLAlchemy
          # session gets the deploy migration step's guards (fail fast on a held lock; bound writes).
          PGOPTIONS: -c lock_timeout=10s -c statement_timeout=120s
          SKIP_REDIS_INIT: 'true'
          SECRET_KEY: ops-workflow-secret-key-not-used-0123456789
          STRIPE_SECRET_KEY: sk_test_ops
          STRIPE_WEBHOOK_SECRET: whsec_ops
          PWNED_PASSWORD_CHECK_ENABLED: 'false'
        run: |
          set -euo pipefail
          [ -f scripts/repair_ticker_by_cik.py ] || { echo "::error::repair script not committed yet"; exit 1; }
          if [ "${{ steps.request.outputs.operation }}" = "repair-ticker-apply" ]; then
            python scripts/repair_ticker_by_cik.py --apply
          else
            python scripts/repair_ticker_by_cik.py
          fi

      # ------------------------------------------------------------------ internal jobs
      - name: Trigger companyfacts resync (internal endpoint; jobs-channel fallback)
        if: steps.request.outputs.operation == 'sync-companyfacts'
        run: |
          set -euo pipefail
          TICKERS="${{ steps.request.outputs.tickers }}"
          [ -n "$TICKERS" ] || { echo "::error::tickers input required"; exit 1; }
          TOKEN="$(gcloud secrets versions access latest --secret=INTERNAL_JOB_TOKEN 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'tickers': sys.argv[1].split(','), 'force': True}))" "$TICKERS")
            curl -fsS -X POST "https://api.earningsnerd.io/internal/jobs/sync-companyfacts" \
              -H "X-Internal-Token: ${TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo ""
            echo "resync ACCEPTED via internal endpoint for: $TICKERS (runs in the service background)"
          else
            echo "INTERNAL_JOB_TOKEN not accessible to this SA — using the documented jobs channel."
            # gcloud --args is comma-delimited; the ^;^ prefix switches the delimiter to ';' so
            # the comma-separated ticker LIST survives as a single --tickers value (else only the
            # first ticker would be received and the rest parsed as stray args).
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/sync_companyfacts.py;--tickers;${TICKERS};--force" --wait
            echo "resync COMPLETED via jobs channel for: $TICKERS"
          fi

      - name: Trigger filing-history backfill (internal endpoint; jobs-channel fallback)
        if: steps.request.outputs.operation == 'backfill-filing-history'
        run: |
          set -euo pipefail
          TICKERS="${{ steps.request.outputs.tickers }}"
          TOKEN="$(gcloud secrets versions access latest --secret=INTERNAL_JOB_TOKEN 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            if [ -n "$TICKERS" ]; then
              PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'tickers': sys.argv[1].split(',')}))" "$TICKERS")
            else
              PAYLOAD='{"watchlist_only": true}'
            fi
            curl -fsS -X POST "https://api.earningsnerd.io/internal/jobs/backfill-filing-history" \
              -H "X-Internal-Token: ${TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo ""
            echo "backfill-filing-history ACCEPTED via internal endpoint for: ${TICKERS:-watchlist} (runs in the service background)"
          else
            echo "INTERNAL_JOB_TOKEN not accessible to this SA — using the documented jobs channel."
            if [ -n "$TICKERS" ]; then
              # ^;^ switches gcloud's --args delimiter to ';' so the comma-separated ticker LIST
              # survives as a single --tickers value.
              gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
                --args="^;^scripts/backfill_filing_history.py;--tickers;${TICKERS}" --wait
            else
              gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
                --args="scripts/backfill_filing_history.py,--watchlist-only" --wait
            fi
            echo "backfill-filing-history COMPLETED via jobs channel for: ${TICKERS:-watchlist}"
          fi

      - name: Run the weekly data-quality report once (P1-9; jobs channel)
        if: steps.request.outputs.operation == 'data-quality-report'
        run: |
          set -euo pipefail
          # Same payload as .github/workflows/data-quality-weekly.yml: fire the report script inside
          # earningsnerd-filing-digest — the only job carrying both DATABASE_URL and RESEND_API_KEY
          # (Phase-0 probe). The job's entrypoint is `python`; --args appends the script path. Script
          # stdout lands in Cloud Run logs, not here — a green --wait means it built the report and
          # emailed the founder without error. Use this for a one-shot/ad-hoc fire; the scheduled
          # weekly run is driven by data-quality-weekly.yml's cron.
          gcloud run jobs execute earningsnerd-filing-digest --region="$REGION" \
            --args="scripts/data_quality_report.py" --wait
          echo "data-quality report COMPLETED via jobs channel (emails the founder via Resend)"

      - name: Reset a single filing's summary (per-filing regen; jobs channel)
        if: contains('reset-filing-summary-dry-run reset-filing-summary-apply', steps.request.outputs.operation)
        run: |
          set -euo pipefail
          TICKER="${{ steps.request.outputs.tickers }}"
          [ -n "$TICKER" ] || { echo "::error::a single ticker is required in the tickers field"; exit 1; }
          # Runs the committed per-filing reset in the jobs-channel container (which carries
          # DATABASE_URL). ^;^ switches gcloud's --args delimiter to ';' so each flag stays separate.
          # The script defaults to a dry run; --execute is added only for the -apply operation.
          if [ "${{ steps.request.outputs.operation }}" = "reset-filing-summary-apply" ]; then
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/reset_filing_summary.py;--ticker;${TICKER};--form;10-K;--execute" --wait
            echo "reset-filing-summary APPLIED via jobs channel for: ${TICKER} 10-K (regenerates lazily on next view)"
          else
            gcloud run jobs execute "$JOBS_CHANNEL_JOB" --region="$REGION" \
              --args="^;^scripts/reset_filing_summary.py;--ticker;${TICKER};--form;10-K" --wait
            echo "reset-filing-summary DRY RUN via jobs channel for: ${TICKER} 10-K"
          fi

      # ------------------------------------------------------------------ emergency rollback
      - name: Roll service traffic back to a named revision
        if: steps.request.outputs.operation == 'rollback-traffic'
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="${{ steps.request.outputs.revision }}=100"
          echo "traffic pinned to ${{ steps.request.outputs.revision }} — remember to re-run update-traffic --to-latest after the fix deploys"
