name: H25 bounded offline capacity probe

# A single diagnostic branch push; this workflow is not a production release path.
on:
  push:
    branches: [codex/wave3-h25-capacity-probe]

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/diagnostics
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch and verify frozen public-source capsule
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p result
          stage=copy
          trap 'status=$?; echo "$stage $status" > result/input-stage-status.txt' EXIT
          # Public SEC bytes live only on this diagnostic branch. The read-only
          # workflow token cannot fetch the draft release; no permission is added.
          cp "$GITHUB_WORKSPACE/.github/diagnostics/linux-capacity-capsule-v3.zip" .
          stage=verify
          echo '4877af596173961fcd141db35235a22b75b18b8ec622e8f99d1eeaa87a8eb743  linux-capacity-capsule-v3.zip' | sha256sum --check --strict
          stage=extract
          python -m zipfile -e linux-capacity-capsule-v3.zip capsule
          stage=ready
      - name: Measure with no network and enforced process limits
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/capsule"
          PYTHON_BIN="$(command -v python)"
          mkdir -p "$RUNNER_TEMP/result"
          # The capsule independently sets a hard 3 GiB RLIMIT_AS before each child
          # and kills its process group after 180 seconds. This outer timeout also
          # bounds the parent. No repository, provider or cloud credentials enter.
          if timeout --signal=TERM --kill-after=5s 380s sudo unshare --net -- \
            env -i PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" \
            LD_LIBRARY_PATH="$(dirname "$PYTHON_BIN")/../lib" \
            HOME="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 \
            "$PYTHON_BIN" runner.py --output "$RUNNER_TEMP/result/capacity-receipt.json" \
            > "$RUNNER_TEMP/result/runner.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          echo "$result" > "$RUNNER_TEMP/result/exit-code.txt"
          # A measured resource failure is retained as a failing diagnostic,
          # never retried or converted to a successful capacity claim.
          exit "$result"
      - name: Retain bounded diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h25-capacity-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 7
