version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Only group patch-level security fixes together (safe to auto-merge)
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
      minor-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Prevent Dependabot from proposing major version bumps automatically.
    # Major upgrades (Next.js 14→16, Tailwind 3→4, etc.) require manual
    # migration and should be handled as dedicated tasks, not auto-PRs.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is outside typescript-eslint's peer range (<6.1.0) and
      # crashes ESLint (Dependabot PR #629). Take TS majors deliberately, with the lint stack.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "neilmac91"
    commit-message:
      prefix: "fix(deps):"

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
      minor-updates:
        # Excluded packages get their own PRs instead of riding the weekly group.
        # edgartools is held on 5.58.0 (decision D, issue #1063); its own PR is gated by the Ford test.
        exclude-patterns:
          - "sqlalchemy"
          - "edgartools"
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # SQLAlchemy stays on 2.0.x (#1010 set the <2.1 cap): 2.1 maps a bare postgresql:// URL to
      # psycopg 3, which is not installed (#1095). 2.0.x patch updates still arrive.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor"]
    reviewers:
      - "neilmac91"
    commit-message:
      prefix: "fix(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps):"
